<title>Génesis en pareja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Figtree:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Concepto: un códice de tres columnas. A la izquierda el plan según los toledot del propio libro,
   al centro la lectura (~68 caracteres), a la derecha el contexto (lugar, tiempo, palabras).
   Paleta: lapislázuli y oro del Estandarte Real de Ur, la ciudad de Abraham. */
:root {
  --bg: #f1f2ee; --surface: #ffffff; --surface-2: #f7f8f5; --ink: #1a2130; --muted: #586072; --line: #d9dcd4;
  --lapis: #22418c; --lapis-soft: #e3e8f5; --oro: #94660f; --oro-soft: #f5ecd6; --cornalina: #9c3d24;
  --olivo: #46653a; --olivo-soft: #e6eedf; --sombra: 0 1px 2px rgba(26,33,48,.06), 0 8px 24px rgba(26,33,48,.06);
  --f-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-texto: "Literata", "Iowan Old Style", Georgia, serif;
  --f-ui: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-heb: "Frank Ruhl Libre", "Times New Roman", serif;
  --texto: 1.06rem; --radio: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c101b; --surface: #141a29; --surface-2: #10151f; --ink: #e8e5dc; --muted: #a2a8b5; --line: #263049;
  --lapis: #93abf0; --lapis-soft: #1b2442; --oro: #e2bb5c; --oro-soft: #2a2414; --cornalina: #e48c6d;
  --olivo: #a3c285; --olivo-soft: #1b2618; --sombra: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c101b; --surface: #141a29; --surface-2: #10151f; --ink: #e8e5dc; --muted: #a2a8b5; --line: #263049;
  --lapis: #93abf0; --lapis-soft: #1b2442; --oro: #e2bb5c; --oro-soft: #2a2414; --cornalina: #e48c6d;
  --olivo: #a3c285; --olivo-soft: #1b2618; --sombra: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }
:root[data-size="grande"] { --texto: 1.18rem; }
:root[data-size="chica"] { --texto: .98rem; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--texto)/1.65 var(--f-texto); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--lapis); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; border-radius: 4px; }
.heb { font-family: var(--f-heb); direction: rtl; unicode-bidi: isolate; }

/* Barra superior */
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); font-family: var(--f-ui); }
.marca { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.marca b { font: 600 1.45rem/1 var(--f-display); letter-spacing: .01em; white-space: nowrap; }
.marca .heb { color: var(--oro); font-size: 1.05rem; }
.barra .esp { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font: 500 .86rem/1.2 var(--f-ui); cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--lapis); }
.btn.prim { background: var(--lapis); border-color: var(--lapis); color: var(--surface); }
.btn.oro { background: var(--oro-soft); border-color: var(--oro); color: var(--ink); }
.icono { width: 34px; height: 34px; padding: 0; justify-content: center; }
.anillo { display: flex; align-items: center; gap: 8px; font: 500 .82rem var(--f-ui); color: var(--muted); white-space: nowrap; }
.anillo svg { width: 30px; height: 30px; }
.menu-btn { display: none; }

/* Estructura */
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr) 300px; gap: 28px; max-width: 1480px; margin: 0 auto;
  padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 96px); overflow-y: auto; font-family: var(--f-ui); padding-right: 4px; }
.nav h4 { font: 600 .72rem var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
.nav a.item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: .9rem; }
.nav a.item:hover { background: var(--surface); }
.nav a.item.actual { background: var(--lapis-soft); color: var(--lapis); font-weight: 600; }
.tol { margin-top: 10px; }
.tol summary { cursor: pointer; list-style: none; padding: 6px 8px; border-radius: 8px; }
.tol summary::-webkit-details-marker { display: none; }
.tol summary:hover { background: var(--surface); }
.tol .t1 { font: 600 .74rem var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--oro); }
.tol .t2 { display: block; font: 600 1.08rem/1.25 var(--f-display); color: var(--ink); }
.tol .t3 { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); }
.dia-l { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: baseline; padding: 4px 8px; border-radius: 8px;
  text-decoration: none; color: var(--ink); font-size: .84rem; line-height: 1.3; }
.dia-l:hover { background: var(--surface); }
.dia-l .n { font: 600 .74rem var(--f-ui); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.dia-l .r { font-size: .72rem; color: var(--muted); white-space: nowrap; }
.dia-l.hecho .n { color: var(--olivo); }
.dia-l.hecho .n::before { content: "✓ "; }
.dia-l.actual { background: var(--lapis-soft); }
.dia-l.pend { opacity: .55; }
.principal { min-width: 0; }
.lado { position: sticky; top: 76px; align-self: start; display: grid; gap: 16px; max-height: calc(100vh - 96px); overflow-y: auto; }

/* Lectura */
.hoja { max-width: 72ch; margin: 0 auto; }
.ojo { font: 600 .76rem var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--oro); }
h1.titulo { font: 600 clamp(2rem, 4vw, 2.9rem)/1.08 var(--f-display); margin: 6px 0 10px; text-wrap: balance; }
h2 { font: 600 1.7rem/1.15 var(--f-display); margin: 40px 0 12px; text-wrap: balance; }
h3 { font: 600 1.28rem/1.25 var(--f-display); margin: 26px 0 8px; text-wrap: balance; }
h3 .rango { font: 600 .78rem var(--f-ui); color: var(--lapis); background: var(--lapis-soft); border-radius: 999px; padding: 2px 9px; margin-right: 8px; vertical-align: middle; letter-spacing: .02em; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font: 500 .86rem var(--f-ui); color: var(--muted); }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; }
p { margin: 0 0 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); padding: 18px 20px; }
.contexto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin: 22px 0; padding: 0; overflow: hidden; }
.contexto > div { padding: 14px 16px; border-right: 1px solid var(--line); min-width: 0; }
.contexto > div:last-child { border-right: 0; }
.contexto .et { font: 600 .7rem var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.contexto .ahora { background: var(--lapis-soft); }
.contexto p { font-size: .92rem; line-height: 1.5; margin: 0; }
.donde-cuando { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: -8px; }
.donde-cuando .panel { padding: 12px 16px; font-size: .9rem; line-height: 1.5; }
.clave { position: relative; margin: 26px 0; padding: 22px 24px 18px 28px; background: var(--oro-soft); border-radius: var(--radio); border-left: 4px solid var(--oro); }
.clave blockquote { margin: 0 0 10px; font: 500 1.42rem/1.38 var(--f-display); font-style: italic; }
.clave cite { font: 600 .8rem var(--f-ui); color: var(--oro); font-style: normal; letter-spacing: .04em; }
.clave .porque { font-size: .92rem; margin: 10px 0 0; color: var(--ink); }
.nota { margin: 0 0 14px; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 4px; vertical-align: 1px; }
.chip { font: 600 .66rem/1 var(--f-ui); letter-spacing: .03em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 7px;
  background: var(--surface); cursor: pointer; white-space: nowrap; }
.chip:hover, .chip[aria-expanded="true"] { color: var(--lapis); border-color: var(--lapis); }
.pop { position: absolute; z-index: 40; max-width: 340px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--sombra);
  padding: 10px 12px; font: 400 .82rem/1.45 var(--f-ui); }
.pop b { font-weight: 600; }
.pop div + div { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
.palabras { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.palabra { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); padding: 12px 14px; min-width: 0; }
.palabra .heb { display: block; font-size: 1.7rem; line-height: 1.2; color: var(--lapis); text-align: right; }
.palabra .tr { font: 600 .9rem var(--f-ui); }
.palabra .rf { font: 500 .72rem var(--f-ui); color: var(--muted); }
.palabra p { font-size: .88rem; line-height: 1.45; margin: 6px 0 0; }
.cristo { border-left: 3px solid var(--cornalina); padding: 4px 0 4px 16px; margin: 0 0 14px; }
.refs { font: 500 .78rem var(--f-ui); color: var(--cornalina); }
details.interp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); margin: 0 0 10px; }
details.interp summary { cursor: pointer; padding: 12px 16px; font: 600 1.05rem var(--f-display); list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details.interp summary::after { content: "+"; font-family: var(--f-ui); color: var(--muted); }
details.interp[open] summary::after { content: "–"; }
details.interp .cuerpo { padding: 0 16px 12px; }
.postura { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: .93rem; }
.postura .quien { font: 600 .8rem var(--f-ui); color: var(--lapis); }
.biblio { display: grid; gap: 12px; }
.biblio .panel { padding: 14px 16px; }
.biblio .autor { font: 600 .78rem var(--f-ui); color: var(--olivo); letter-spacing: .02em; display: block; margin-bottom: 4px; }
.conex { display: grid; grid-template-columns: 110px 1fr; gap: 6px 14px; font-size: .93rem; }
.conex .rf { font: 600 .82rem var(--f-ui); color: var(--lapis); }
.vida { background: var(--olivo-soft); border-radius: var(--radio); padding: 20px 22px; margin-top: 34px; }
.vida h2 { margin-top: 0; }
.vida ul { margin: 0 0 8px; padding-left: 20px; }
.vida li { margin-bottom: 8px; }
.vida h3 { margin-top: 18px; }
.orar { font-style: italic; }
details.prof { margin-top: 26px; }
details.prof > summary { cursor: pointer; font: 600 1.3rem var(--f-display); }
.notas-p textarea { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: var(--radio); padding: 12px; background: var(--surface); color: var(--ink);
  font: 400 .95rem/1.5 var(--f-texto); resize: vertical; }
.estado { font: 500 .76rem var(--f-ui); color: var(--muted); }
.pie-dia { display: flex; justify-content: space-between; gap: 12px; margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); }
.pend-msg { margin-top: 30px; }

/* Artículos: introducción, partes y temas */
.bajada { font: 500 1.22rem/1.45 var(--f-display); font-style: italic; color: var(--muted); margin: 0 0 18px; text-wrap: pretty; }
.entrada p:first-child::first-letter { float: left; font: 600 3.4rem/.85 var(--f-display); color: var(--oro); padding: 6px 8px 0 0; }
.destacado { margin: 18px 0 22px; padding: 14px 18px; border-radius: var(--radio); background: var(--lapis-soft); border-left: 4px solid var(--lapis); }
.destacado .et { font: 600 .7rem var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--lapis); display: block; margin-bottom: 4px; }
.destacado p { margin: 0; }
figure.cita { margin: 30px 0; padding: 0 0 0 22px; border-left: 2px solid var(--oro); }
figure.cita blockquote { margin: 0 0 6px; font: 500 1.35rem/1.4 var(--f-display); font-style: italic; text-wrap: pretty; }
figure.cita figcaption { font: 500 .8rem var(--f-ui); color: var(--muted); }
.indice-arts { display: grid; gap: 12px; margin: 18px 0; }
.indice-arts a { display: grid; grid-template-columns: 44px 1fr; gap: 4px 14px; align-items: start; text-decoration: none; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radio); padding: 14px 16px; }
.indice-arts a:hover { border-color: var(--lapis); }
.indice-arts .num { grid-row: span 2; font: 600 1.9rem/1 var(--f-display); color: var(--oro); text-align: center; }
.indice-arts b { font: 600 1.2rem/1.2 var(--f-display); }
.indice-arts small { color: var(--muted); font: 400 .86rem/1.4 var(--f-ui); }
.indice-arts a.pend { opacity: .55; }
.estructura { display: grid; gap: 4px; margin: 16px 0 24px; font-family: var(--f-ui); }
.estructura .pt { font: 600 .72rem var(--f-ui); letter-spacing: .1em; text-transform: uppercase; margin: 12px 0 2px; }
.estructura a { display: grid; grid-template-columns: minmax(0, 15rem) 1fr; gap: 12px; align-items: center; text-decoration: none; color: var(--ink); padding: 3px 6px; border-radius: 6px; }
.estructura a:hover { background: var(--surface); }
.estructura .et { font-size: .84rem; line-height: 1.25; }
.estructura .et small { display: block; color: var(--muted); font-size: .72rem; }
.estructura .b { height: 12px; border-radius: 99px; min-width: 6px; }
.en-plan { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.aviso-parte { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin: 18px 0 0; padding: 12px 16px;
  border-radius: var(--radio); background: var(--oro-soft); border: 1px solid var(--oro); font: 500 .9rem var(--f-ui); }
h2[id^="ap-"] { scroll-margin-top: 90px; }
.toc a { display: block; padding: 4px 0; color: var(--ink); text-decoration: none; line-height: 1.3; }
.toc a:hover { color: var(--lapis); }
.nav a.sub { padding-left: 22px; font-size: .84rem; color: var(--muted); }
.nav a.parte-l { margin-top: 12px; border: 1px dashed var(--line); }
.nav a.parte-l small { color: var(--muted); font-size: .72rem; }

/* Columna de contexto */
.tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); padding: 14px; font-family: var(--f-ui); font-size: .85rem; }
.tarjeta h5 { margin: 0 0 8px; font: 600 .72rem var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mini-mapa svg { width: 100%; height: auto; display: block; border-radius: 6px; }
.tiempo-barra { position: relative; height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); margin: 10px 0 6px; }
.tiempo-barra span { position: absolute; top: -1px; bottom: -1px; border-radius: 99px; background: var(--lapis); }
.tiempo-et { display: flex; justify-content: space-between; color: var(--muted); font-size: .72rem; }

/* Inicio */
.heroe { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 26px; }
.heroe h1 { font: 600 clamp(2.6rem, 6vw, 4.2rem)/1 var(--f-display); margin: 0; }
.heroe .heb { font-size: clamp(1.8rem, 4vw, 2.6rem); color: var(--oro); display: block; text-align: left; direction: rtl; margin-top: 6px; }
.heroe p { color: var(--muted); max-width: 52ch; }
.hoy { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; box-shadow: var(--sombra); }
.hoy .ojo { display: block; margin-bottom: 4px; }
.hoy h2 { margin: 0 0 6px; font-size: 1.8rem; }
.partes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 22px 0; }
.parte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); padding: 12px 14px; font-family: var(--f-ui); }
.parte b { display: block; font: 600 1.05rem var(--f-display); }
.parte .bar { height: 6px; background: var(--surface-2); border-radius: 99px; margin-top: 8px; overflow: hidden; border: 1px solid var(--line); }
.parte .bar i { display: block; height: 100%; background: var(--olivo); }
.parte small { color: var(--muted); font-size: .76rem; }
.grilla-h { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.grilla-h a { text-decoration: none; color: var(--ink); }
.grilla-h .panel:hover { border-color: var(--lapis); }
.grilla-h b { font: 600 1.15rem var(--f-display); display: block; }
.grilla-h small { color: var(--muted); font-family: var(--f-ui); }
.grilla-h.temas small { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* Herramientas */
.svgcaja { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); padding: 10px; }
.svgcaja svg { display: block; max-width: 100%; height: auto; }
.mapa-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.mapa-tabs .btn[aria-pressed="true"] { background: var(--lapis); color: var(--surface); border-color: var(--lapis); }
.leyenda { font: 400 .78rem var(--f-ui); color: var(--muted); margin-top: 8px; }
.ficha-lugar { margin-top: 10px; }
.lista-pal { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.buscar input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radio); background: var(--surface); color: var(--ink); font: 400 1rem var(--f-ui); }
.resultado { padding: 12px 0; border-bottom: 1px solid var(--line); }
.resultado mark { background: var(--oro-soft); color: inherit; padding: 0 2px; border-radius: 3px; }
.tabla { width: 100%; border-collapse: collapse; font: 400 .86rem var(--f-ui); }
.tabla th, .tabla td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tabla th { font-weight: 600; color: var(--muted); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; }

@media (max-width: 1180px) {
  .app { grid-template-columns: 260px minmax(0, 1fr); }
  .lado { position: static; grid-column: 2; max-height: none; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); padding-block: 16px 56px; }
  .lado { grid-column: 1; }
  .nav { position: fixed; inset: 0 auto 0 0; z-index: 30; width: min(86vw, 330px); max-height: none; background: var(--bg); padding: 70px 16px 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); transform: translateX(-105%); transition: transform .2s ease; box-shadow: var(--sombra); }
  body.nav-abierta .nav { transform: none; }
  .menu-btn { display: inline-flex; }
  .anillo span { display: none; }
  .contexto { grid-template-columns: minmax(0, 1fr); }
  .contexto > div { border-right: 0; border-bottom: 1px solid var(--line); }
  .donde-cuando, .heroe { grid-template-columns: minmax(0, 1fr); }
  .postura { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .conex { grid-template-columns: minmax(0, 1fr); }
  .estructura a { grid-template-columns: minmax(0, 1fr); gap: 3px; }
  .marca .heb { display: none; }
}
@media (max-width: 460px) {
  .barra { gap: 8px; }
  .marca b { font-size: 1.22rem; }
  .anillo { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<header class="barra">
  <button class="btn icono menu-btn" id="menu-btn" aria-label="Abrir el índice"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="marca" href="#inicio"><b>Génesis en pareja</b><span class="heb" lang="he">בְּרֵאשִׁית</span></a>
  <div class="esp"></div>
  <div class="anillo" id="anillo" title="Días terminados"></div>
  <a class="btn icono" href="#buscar" aria-label="Buscar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></a>
  <button class="btn icono" id="tam-btn" aria-label="Cambiar el tamaño de letra">Aa</button>
  <button class="btn icono" id="tema-btn" aria-label="Cambiar entre modo claro y oscuro"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
</header>
<div class="app">
  <nav class="nav" id="nav" aria-label="Índice del estudio"></nav>
  <main class="principal" id="principal"></main>
  <aside class="lado" id="lado" aria-label="Contexto"></aside>
</div>
<script>
/*__DATOS__*/
</script>
<script>
(() => {
const D = window.DATOS;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const n2 = n => String(n).padStart(2, '0');
const PLAN = D.plan, TOTAL = PLAN.length;

/* ---------- estado: progreso y notas (local + compartido) ---------- */
const est = { hechos: {}, notas: {} };
const LS = 'genesis-en-pareja-v1';
try { Object.assign(est, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
const guardarLocal = () => { try { localStorage.setItem(LS, JSON.stringify(est)); } catch (e) {} };
let db = null, compartido = false;
const docDia = d => db && db.collection('pareja').doc('d' + n2(d));
async function escribirDia(d) {
  guardarLocal();
  if (!db) return;
  try { await docDia(d).set({ hecho: !!est.hechos[d], fecha: est.hechos[d] || '', notas: est.notas[d] || '', actualizado: new Date().toISOString() }); }
  catch (e) { marcarEstado('Se guardó solo en esta compu (no se pudo compartir).'); }
}
function marcarEstado(t) { const e = $('#estado-notas'); if (e) e.textContent = t; }
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    db = await window.claude.use('db');
    if (!db) return;
    db.collection('pareja').onSnapshot(snap => {
      compartido = true;
      snap.docs.forEach(doc => {
        const v = doc.data() || {}; const d = parseInt(doc.id.slice(1), 10);
        if (v.hecho) est.hechos[d] = v.fecha || true; else delete est.hechos[d];
        if (typeof v.notas === 'string') {
          const ta = $('#notas-dia');
          if (!(ta && document.activeElement === ta && +ta.dataset.dia === d)) est.notas[d] = v.notas;
        }
      });
      guardarLocal(); pintarProgreso(); pintarNav();
      const ta = $('#notas-dia'); if (ta && document.activeElement !== ta) ta.value = est.notas[+ta.dataset.dia] || '';
      marcarEstado('Compartido entre ustedes dos.');
    }, () => { db = null; });
  } catch (e) { db = null; }
})();

/* ---------- preferencias ---------- */
const PREF = 'genesis-en-pareja-pref';
let pref = {}; try { pref = JSON.parse(localStorage.getItem(PREF) || '{}'); } catch (e) {}
const aplicarPref = () => {
  if (pref.tema) document.documentElement.dataset.theme = pref.tema; else delete document.documentElement.dataset.theme;
  if (pref.tam) document.documentElement.dataset.size = pref.tam; else delete document.documentElement.dataset.size;
};
aplicarPref();
$('#tema-btn').onclick = () => {
  const oscuro = pref.tema ? pref.tema === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  pref.tema = oscuro ? 'light' : 'dark'; aplicarPref(); try { localStorage.setItem(PREF, JSON.stringify(pref)); } catch (e) {}
};
$('#tam-btn').onclick = () => {
  pref.tam = { undefined: 'grande', grande: 'chica', chica: undefined }[pref.tam]; aplicarPref();
  try { localStorage.setItem(PREF, JSON.stringify(pref)); } catch (e) {}
};
$('#menu-btn').onclick = () => document.body.classList.toggle('nav-abierta');

/* ---------- utilidades de contenido ---------- */
const diaPlan = d => PLAN[d - 1];
const cv = r => r.split(':').map(Number);
const menorIgual = (a, b) => a[0] < b[0] || (a[0] === b[0] && a[1] <= b[1]);
const diaQueContiene = ref => (PLAN.find(p => menorIgual(cv(p.desde), cv(ref)) && menorIgual(cv(ref), cv(p.hasta))) || PLAN[0]).dia;
const hayDia = d => !!D.dias[d];
const siguientePendiente = () => (PLAN.find(p => !est.hechos[p.dia]) || PLAN[TOTAL - 1]).dia;
const bg = (desde, hasta) => 'https://www.biblegateway.com/passage/?search=' + encodeURIComponent('Génesis ' + desde + '-' + hasta) + '&version=RVR1960';
function chips(ids) {
  if (!ids || !ids.length) return '';
  const vistos = {};
  ids.forEach(id => { const f = D.fuentes[id]; if (f) (vistos[f[0]] = vistos[f[0]] || []).push(id); });
  return '<span class="chips">' + Object.keys(vistos).map(k =>
    `<button class="chip" data-ids="${esc(vistos[k].join(' '))}" aria-expanded="false">${esc(k)}</button>`).join('') + '</span>';
}
let popAbierto = null;
document.addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (popAbierto) { popAbierto.remove(); document.querySelectorAll('.chip[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false')); popAbierto = null; }
  if (c) {
    const ids = c.dataset.ids.split(' ');
    const pop = document.createElement('div'); pop.className = 'pop'; pop.setAttribute('role', 'dialog');
    pop.innerHTML = ids.map(id => { const f = D.fuentes[id]; return f ? `<div><b>${esc(f[1])}</b><br>${esc(f[2] || '')}</div>` : ''; }).join('');
    document.body.appendChild(pop);
    const r = c.getBoundingClientRect(); const w = Math.min(340, innerWidth - 32);
    pop.style.width = w + 'px';
    pop.style.left = Math.max(16, Math.min(innerWidth - w - 16, r.left + scrollX)) + 'px';
    pop.style.top = (r.bottom + scrollY + 6) + 'px';
    c.setAttribute('aria-expanded', 'true'); popAbierto = pop; e.stopPropagation();
  }
  if (e.target.closest('.nav a')) document.body.classList.remove('nav-abierta');
});
const parr = t => esc(t).split(/\n{2,}/).map(x => `<p>${x.replace(/\n/g, '<br>')}</p>`).join('');
const ARTS = D.articulos_orden || [];
const artDe = id => (D.articulos || {})[id];
const tituloArt = a => (artDe(a.id) || {}).titulo || a.titulo;
const COLOR_PARTE = { I: 'var(--lapis)', II: 'var(--oro)', III: 'var(--olivo)', IV: 'var(--cornalina)' };

/* ---------- progreso y navegación ---------- */
function pintarProgreso() {
  const hechos = Object.keys(est.hechos).length, p = hechos / TOTAL, R = 12, C = 2 * Math.PI * R;
  $('#anillo').innerHTML = `<svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="${R}" fill="none" stroke="var(--line)" stroke-width="4"/>
    <circle cx="15" cy="15" r="${R}" fill="none" stroke="var(--olivo)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C * p} ${C}" transform="rotate(-90 15 15)"/></svg>
    <span>${hechos} de ${TOTAL} días</span>`;
}
let rutaActual = '';
function pintarNav() {
  const actual = rutaActual;
  const it = (h, t) => `<a class="item ${actual === h ? 'actual' : ''}" href="#${h}">${t}</a>`;
  let h = it('inicio', 'Inicio') + it('como-usar', 'Cómo usar el estudio') + it('introduccion', 'Introducción a Génesis');
  const enIntro = actual === 'introduccion' || /^art-I/.test(actual);
  if (enIntro) h += ARTS.filter(a => a.grupo === 'intro').map(a => `<a class="item sub ${actual === 'art-' + a.id ? 'actual' : ''}" href="#art-${a.id}">${esc(tituloArt(a))}</a>`).join('');
  h += '<h4>El plan, según el libro</h4>';
  let parteVista = '';
  D.toledot.forEach(t => {
    const dias = PLAN.filter(p => p.toledot === t.id);
    if (dias.length && dias[0].parte !== parteVista) {
      parteVista = dias[0].parte; const a = ARTS.find(x => x.grupo === 'parte' && x.parte === parteVista);
      if (a) h += `<a class="item parte-l ${actual === 'art-' + a.id ? 'actual' : ''}" href="#art-${a.id}"><span>${esc(a.titulo)}<br><small>Panorama antes de empezar · Gn ${esc(a.rango)}</small></span></a>`;
    }
    if (!dias.length) { const dd = diaQueContiene(t.inicio);
      h += `<div class="tol"><a class="dia-l" href="#dia-${dd}" style="grid-template-columns:1fr"><span><span class="t1" style="display:block">${esc(t.etiqueta)} · Gn ${esc(t.rango)}</span><b style="font:600 1.02rem var(--f-display)">${esc(t.titulo)}</b> <span class="r">se lee en el día ${dd}</span></span></a></div>`; return; }
    const hechos = dias.filter(p => est.hechos[p.dia]).length;
    const abierto = dias.some(p => actual === 'dia-' + p.dia) || (actual === 'inicio' && dias.some(p => p.dia === siguientePendiente()));
    h += `<details class="tol" ${abierto ? 'open' : ''}><summary><span class="t1">${esc(t.etiqueta)}</span><span class="t2">${esc(t.titulo)}</span>
      <span class="t3"><span>Gn ${esc(t.rango)}</span><span>${hechos}/${dias.length}</span></span></summary>` +
      dias.map(p => `<a class="dia-l ${est.hechos[p.dia] ? 'hecho' : ''} ${actual === 'dia-' + p.dia ? 'actual' : ''} ${hayDia(p.dia) ? '' : 'pend'}" href="#dia-${p.dia}">
        <span class="n">${p.dia}</span><span>${esc(p.titulo)}</span><span class="r">${esc(p.desde)}</span></a>`).join('') + '</details>';
  });
  const temas = ARTS.filter(a => a.grupo === 'tema');
  if (temas.length) h += '<h4>Temas de Génesis</h4>' + it('temas', 'Todos los temas') + temas.map(a => it('art-' + a.id, esc(tituloArt(a)))).join('');
  h += '<h4>Herramientas</h4>' + it('mapas', 'Mapas y viajes') + it('linea', 'Línea de tiempo') + it('familias', 'Árboles genealógicos') +
    it('palabras', 'Palabras hebreas') + it('cristo', 'Cristo en Génesis') + it('buscar', 'Buscar') + it('fuentes', 'Fuentes del estudio');
  $('#nav').innerHTML = h;
}

/* ---------- vistas ---------- */
function vistaInicio() {
  const d = siguientePendiente(), p = diaPlan(d), hechos = Object.keys(est.hechos).length;
  const partes = D.toledot.map(t => { const ds = PLAN.filter(x => x.toledot === t.id);
    if (!ds.length) { const dd = diaQueContiene(t.inicio); return `<a class="parte" href="#dia-${dd}" style="text-decoration:none;color:inherit"><small>${esc(t.etiqueta)}</small><b>${esc(t.titulo)}</b><small>Gn ${esc(t.rango)} · se lee en el día ${dd}</small></a>`; }
    const h = ds.filter(x => est.hechos[x.dia]).length;
    return `<a class="parte" href="#dia-${ds[0].dia}" style="text-decoration:none;color:inherit"><small>${esc(t.etiqueta)}</small><b>${esc(t.titulo)}</b>
      <div class="bar"><i style="width:${ds.length ? 100 * h / ds.length : 0}%"></i></div><small>${h} de ${ds.length} días</small></a>`; }).join('');
  return `<div class="hoja" style="max-width:none">
    <section class="heroe"><div><h1>Génesis</h1><span class="heb" lang="he">בְּרֵאשִׁית</span>
      <p>Un estudio para leer de a dos, unos veinte versículos por día, en media hora. Todo sale de los comentarios y libros de su biblioteca, con la fuente de cada afirmación.</p></div>
      <div class="hoy"><span class="ojo">${hechos ? 'Siguen con' : 'Para empezar'} · Día ${d} de ${TOTAL}</span><h2>${esc(p.titulo)}</h2>
        <div class="meta"><span>Génesis ${esc(p.desde)}–${esc(p.hasta)}</span><span>${p.versiculos} versículos</span></div>
        <div class="acciones"><a class="btn prim" href="#dia-${d}">Abrir el día ${d}</a>${hechos ? '' : '<a class="btn" href="#introduccion">Leer antes la introducción</a>'}</div></div></section>
    <h2>Las secciones del libro</h2><p style="color:var(--muted)">Génesis se ordena con una frase que se repite: «Estas son las generaciones de…» (en hebreo, <span class="heb" lang="he">תּוֹלְדֹת</span>, <i>toledot</i>). El plan sigue esas secciones.</p>
    <div class="partes">${partes}</div>
    ${ARTS.some(a => a.grupo === 'tema') ? `<h2>Los grandes temas</h2><div class="grilla-h temas">${ARTS.filter(a => a.grupo === 'tema').map(a => `<a href="#art-${a.id}"><div class="panel"><b>${esc(tituloArt(a))}</b><small>${esc((artDe(a.id) || {}).bajada || 'En preparación.')}</small></div></a>`).join('')}</div>` : ''}
    <h2>Para acompañar la lectura</h2><div class="grilla-h">
      <a href="#mapas"><div class="panel"><b>Mapas y viajes</b><small>De Ur a Egipto: los recorridos de Abraham, Jacob y José.</small></div></a>
      <a href="#linea"><div class="panel"><b>Línea de tiempo</b><small>Las edades de los patriarcas, según las cifras del texto.</small></div></a>
      <a href="#familias"><div class="panel"><b>Árboles genealógicos</b><small>De Adán a las doce tribus.</small></div></a>
      <a href="#palabras"><div class="panel"><b>Palabras hebreas</b><small>Las que comentan las fuentes, día por día.</small></div></a>
    </div></div>`;
}
function bloqueNotas(d) {
  return `<section class="notas-p"><h2>Sus notas del día</h2><textarea id="notas-dia" data-dia="${d}" placeholder="Lo que aprendieron, lo que conversaron, por qué van a orar…">${esc(est.notas[d] || '')}</textarea>
    <div class="estado" id="estado-notas">${db ? (compartido ? 'Compartido entre ustedes dos.' : 'Conectando…') : 'Se guarda en esta compu.'}</div></section>`;
}
function vistaDia(d) {
  const p = diaPlan(d); if (!p) return vistaInicio();
  const x = D.dias[d];
  const ant = d > 1 ? diaPlan(d - 1) : null, sig = d < TOTAL ? diaPlan(d + 1) : null;
  const tol = D.toledot.find(t => t.id === p.toledot);
  const artParte = ARTS.find(a => a.grupo === 'parte' && a.parte === p.parte);
  const empiezaParte = artParte && (!ant || ant.parte !== p.parte);
  let h = `<article class="hoja">${empiezaParte ? `<div class="aviso-parte" style="margin:0 0 18px"><span>Empieza la <b>${esc(artParte.titulo)}</b>. Antes de leer, conviene mirar el panorama.</span><a class="btn" href="#art-${artParte.id}">Ver el panorama →</a></div>` : ''}<span class="ojo">${esc(tol.etiqueta)} · Día ${d} de ${TOTAL}</span>
    <h1 class="titulo">${esc(x ? x.titulo : p.titulo)}</h1>
    <div class="meta"><span>Génesis ${esc(p.desde)}–${esc(p.hasta)}</span><span>${p.versiculos} versículos</span>${x ? `<span>≈ ${x.minutos.lectura} min de lectura + ${x.minutos.estudio} de estudio</span>` : ''}</div>
    <div class="acciones"><a class="btn prim" href="${bg(p.desde, p.hasta)}" target="_blank" rel="noopener">Leer el pasaje (RVR1960) ↗</a>
      <button class="btn ${est.hechos[d] ? 'oro' : ''}" id="hecho-btn">${est.hechos[d] ? '✓ Terminado' : 'Marcar como terminado'}</button></div>`;
  if (!x) {
    h += `<div class="panel pend-msg"><p><b>Este día está en preparación.</b> El plan ya lo tiene ubicado; el estudio se está escribiendo con el material de la biblioteca.</p>
      <p>Mientras tanto pueden leer el pasaje y usar las herramientas: mapas, línea de tiempo y árboles.</p></div>`;
  } else {
    const c = x.contexto;
    h += `<div class="contexto panel"><div><span class="et">Antes</span><p>${esc(c.antes)}</p></div><div class="ahora"><span class="et">Ahora</span><p>${esc(c.ahora)}</p></div><div><span class="et">Después</span><p>${esc(c.despues)}</p></div></div>
      <div class="donde-cuando"><div class="panel"><span class="ojo">Dónde</span><br>${esc(c.donde)}</div><div class="panel"><span class="ojo">Cuándo</span><br>${esc(c.cuando)} ${chips(c.fuentes)}</div></div>`;
    const vk = x.versiculo_clave; const vt = D.rvr[vk.ref];
    if (vt) h += `<figure class="clave"><blockquote>«${esc(vt).replace(/\n/g, ' / ')}»</blockquote><cite>Génesis ${esc(vk.ref)} · RVR1960</cite><p class="porque">${esc(vk.porque)}</p></figure>`;
    h += `<h2>El pasaje de un vistazo</h2>${parr(x.panorama.texto)}${chips(x.panorama.fuentes)}`;
    h += `<h2>Versículo por versículo</h2>` + x.secciones.map(s => `<h3><span class="rango">${esc(s.rango)}</span>${esc(s.titulo)}</h3>` +
      s.notas.map(n => `<p class="nota">${esc(n.texto)} ${chips(n.fuentes)}</p>`).join('')).join('');
    if (x.palabras.length) h += `<h2>Palabras para entender</h2><div class="palabras">` + x.palabras.map(w => `<div class="palabra">${w.hebreo ? `<span class="heb" lang="he">${esc(w.hebreo)}</span>` : ''}
      <span class="tr">${esc(w.translit)}</span> <span class="rf">· ${esc(w.ref)}</span><p>${esc(w.significado)} ${chips(w.fuentes)}</p></div>`).join('') + '</div>';
    if (x.cristo.length) h += `<h2>Cristo en el pasaje</h2>` + x.cristo.map(k => `<div class="cristo"><p>${esc(k.texto)} ${chips(k.fuentes)}</p>${k.refs && k.refs.length ? `<span class="refs">${esc(k.refs.join(' · '))}</span>` : ''}</div>`).join('');
    if (x.interpretaciones.length) h += `<h2>Preguntas difíciles e interpretaciones</h2>` + x.interpretaciones.map(i => `<details class="interp"><summary>${esc(i.tema)}</summary><div class="cuerpo">` +
      i.posturas.map(q => `<div class="postura"><span class="quien">${esc(q.quien)}</span><span>${esc(q.postura)} ${chips(q.fuentes)}</span></div>`).join('') +
      (i.nota ? `<p style="margin-top:10px;font-size:.92rem">${esc(i.nota)}</p>` : '') + '</div></details>').join('');
    if (x.biblioteca && x.biblioteca.length) h += `<h2>Desde la biblioteca</h2><div class="biblio">` + x.biblioteca.map(b => `<div class="panel"><span class="autor">${esc(b.autor)} · ${esc(b.obra)}</span>${esc(b.texto)} ${chips(b.fuentes)}</div>`).join('') + '</div>';
    if (x.conexiones.length) h += `<h2>Conexiones con el resto de la Biblia</h2><div class="conex">` + x.conexiones.map(k => `<span class="rf">${esc(k.ref)}</span><span>${esc(k.nota)} ${chips(k.fuentes)}</span>`).join('') + '</div>';
    h += `<section class="vida"><h2>Para la vida de ustedes</h2><ul>${x.para_vivir.map(v => `<li>${esc(v.texto)} ${chips(v.fuentes)}</li>`).join('')}</ul>
      <h3>Para conversar</h3><ol>${x.para_conversar.map(q => `<li>${esc(q)}</li>`).join('')}</ol>
      <h3>Para orar</h3><p class="orar">${esc(x.para_orar)}</p></section>`;
    if (x.profundizar.length) h += `<details class="prof"><summary>Para profundizar (optativo)</summary>` + x.profundizar.map(f => `<h3>${esc(f.titulo)}</h3><p>${esc(f.texto)} ${chips(f.fuentes)}</p>`).join('') + '</details>';
  }
  h += bloqueNotas(d);
  h += `<nav class="pie-dia" aria-label="Días">${ant ? `<a class="btn" href="#dia-${ant.dia}">← Día ${ant.dia}</a>` : '<span></span>'}${sig ? `<a class="btn" href="#dia-${sig.dia}">Día ${sig.dia} →</a>` : ''}</nav></article>`;
  return h;
}
function ladoDia(d) {
  const p = diaPlan(d), x = D.dias[d];
  let h = '';
  const lugares = (D.lugares_dia[d] || []).map(id => D.mapas.lugares.find(l => l.id === id)).filter(Boolean);
  h += `<div class="tarjeta mini-mapa"><h5>Dónde</h5>${lugares.length ? mapaSVG(marcoPara(lugares.map(l => l.id)), null, lugares.map(l => l.id), true) : ''}
    <div class="leyenda">${lugares.length ? lugares.map(l => esc(l.nombre)).join(' · ') : 'Ver los mapas completos'} · <a href="#mapas">abrir mapas</a></div></div>`;
  const t = D.linea_dia[d];
  if (t) h += `<div class="tarjeta"><h5>En la historia de Génesis</h5><div>${esc(t.texto)}</div>
    <div class="tiempo-barra"><span style="left:${t.desde}%;width:${Math.max(1.5, t.hasta - t.desde)}%"></span></div><div class="tiempo-et"><span>Creación</span><span>Muerte de José</span></div></div>`;
  if (x && x.palabras.length) h += `<div class="tarjeta"><h5>Palabras del día</h5>${x.palabras.slice(0, 6).map(w => `<div style="display:flex;justify-content:space-between;gap:8px;padding:3px 0"><span>${esc(w.translit)}</span>${w.hebreo ? `<span class="heb" lang="he" style="color:var(--lapis)">${esc(w.hebreo)}</span>` : ''}</div>`).join('')}</div>`;
  const hechos = Object.keys(est.hechos).length;
  h += `<div class="tarjeta"><h5>Su avance</h5><div>${hechos} de ${TOTAL} días terminados.</div></div>`;
  return h;
}

/* ---------- mapas ---------- */
function marcoPara(ids) {
  const ls = ids.map(id => D.mapas.lugares.find(l => l.id === id)).filter(Boolean);
  return ls.length && ls.every(l => l.canaan) ? 'canaan' : 'oriente';
}
function mapaSVG(marco, recorrido, resaltar, mini) {
  const M = D.mapas.marcos[marco]; if (!M) return '';
  const set = new Set(resaltar || []);
  let pasos = [];
  if (recorrido) pasos = D.mapas.recorridos[recorrido].pasos.map(s => ({ ...s, l: D.mapas.lugares.find(l => l.id === s.lugar) })).filter(s => s.l && s.l[marco]);
  const enRuta = new Set(pasos.map(s => s.lugar));
  const visibles = D.mapas.lugares.filter(l => l[marco] && (recorrido ? (enRuta.has(l.id) || (l.tipo === 'region' && !mini)) : mini ? set.has(l.id) : true));
  // encuadre: en el mini mapa se acerca a los lugares del día
  let vb = [0, 0, M.W, M.H];
  if (mini && visibles.length) {
    const xs = visibles.map(l => l[marco][0]), ys = visibles.map(l => l[marco][1]);
    let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const minW = M.W * (marco === 'canaan' ? .55 : .32), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    let w = Math.max(minW, (x1 - x0) * 1.5), h = Math.max(w * .8, (y1 - y0) * 1.5); w = Math.max(w, h / .8);
    vb = [Math.max(0, Math.min(M.W - w, cx - w / 2)), Math.max(0, Math.min(M.H - h, cy - h / 2)), Math.min(w, M.W), Math.min(h, M.H)];
  }
  const k = vb[2] / M.W, fs = (marco === 'canaan' ? 15 : 14) * Math.max(k, mini ? .45 : .7) * (mini ? 1.6 : 1), rr = fs * .38;
  const ruta = pasos.length > 1 ? `<polyline points="${pasos.map(s => s.l[marco].join(',')).join(' ')}" fill="none" stroke="var(--cornalina)" stroke-width="${fs * .18}" stroke-dasharray="${fs * .5} ${fs * .35}" stroke-linejoin="round" stroke-linecap="round"/>` : '';
  // etiquetas sin superposición (prioridad: lugares del recorrido o del día, después ciudades)
  const cajas = [], choca = b => cajas.some(c => b[0] < c[2] && b[2] > c[0] && b[1] < c[3] && b[3] > c[1]);
  const orden = visibles.slice().sort((a, b) => (set.has(b.id) || enRuta.has(b.id)) - (set.has(a.id) || enRuta.has(a.id)) || (a.tipo === 'region') - (b.tipo === 'region'));
  const puntos = [], textos = [];
  orden.forEach(l => {
    const [x, y] = l[marco]; const dest = set.has(l.id) || enRuta.has(l.id);
    if (l.tipo === 'region') {
      const w = l.nombre.length * fs * .5, b = [x - w / 2, y - fs, x + w / 2, y + 2];
      if (!choca(b)) { cajas.push(b); textos.push(`<text x="${x}" y="${y}" text-anchor="middle" font-size="${fs * 1.05}" font-style="italic" fill="var(--muted)" font-family="var(--f-display)">${esc(l.nombre)}</text>`); }
      return;
    }
    const r = dest ? rr * 1.5 : rr;
    puntos.push(`<g class="lugar" data-id="${l.id}" style="cursor:pointer"><title>${esc(l.nombre)}</title><circle cx="${x}" cy="${y}" r="${r}" fill="${dest ? 'var(--oro)' : 'var(--ink)'}" stroke="var(--surface)" stroke-width="${r * .35}" ${l.certeza === 'baja' ? `stroke-dasharray="${r * .5} ${r * .5}"` : ''}/></g>`);
    const w = l.nombre.length * fs * .52;
    for (const [dx, anc] of [[r + fs * .35, 'start'], [-(r + fs * .35), 'end']]) {
      const bx = anc === 'start' ? [x + dx, y - fs * .8, x + dx + w, y + fs * .3] : [x + dx - w, y - fs * .8, x + dx, y + fs * .3];
      if (!choca(bx)) { cajas.push(bx); textos.push(`<text x="${x + dx}" y="${y + fs * .33}" text-anchor="${anc}" font-size="${fs}" font-family="var(--f-ui)" font-weight="${dest ? 600 : 400}" fill="var(--ink)" paint-order="stroke" stroke="var(--surface)" stroke-width="${fs * .22}">${esc(l.nombre)}</text>`); break; }
    }
  });
  const rios = Object.values(M.rios).map(v => `<path d="${v}" fill="none" stroke="var(--lapis)" stroke-width="${(marco === 'canaan' ? 2 : 1.4) * Math.max(k, .5)}" opacity=".7"/>`).join('');
  return `<svg viewBox="${vb.map(v => v.toFixed(1)).join(' ')}" role="img" aria-label="Mapa${recorrido ? ': ' + esc(D.mapas.recorridos[recorrido].nombre) : ''}">
    <rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="var(--lapis-soft)"/>
    <path d="${M.tierra}" fill="var(--surface-2)" stroke="var(--line)" stroke-width="${Math.max(k, .5)}"/>
    <path d="${M.lagos}" fill="var(--lapis-soft)" stroke="var(--lapis)" stroke-width="${.8 * Math.max(k, .5)}"/>${rios}${ruta}${puntos.join('')}${textos.join('')}</svg>`;
}

/* ---------- línea de tiempo ---------- */
function vistaLinea() {
  const L = D.linea, max = 2400, W = 980, fila = 22, H = L.personas.length * fila + 70, x = a => 150 + (a / max) * (W - 170);
  const ejes = [0, 400, 800, 1200, 1600, 2000, 2400].map(a => `<line x1="${x(a)}" y1="30" x2="${x(a)}" y2="${H - 30}" stroke="var(--line)"/><text x="${x(a)}" y="22" font-size="11" text-anchor="middle" fill="var(--muted)" font-family="var(--f-ui)">${a}</text>`).join('');
  const barras = L.personas.map((p, i) => { const y = 40 + i * fila;
    return `<text x="140" y="${y + 12}" text-anchor="end" font-size="12.5" font-family="var(--f-ui)" fill="var(--ink)">${esc(p.nombre)}</text>
      <rect x="${x(p.nace)}" y="${y}" width="${Math.max(2, x(p.muere) - x(p.nace))}" height="15" rx="4" fill="${p.grupo === 'antes' ? 'var(--lapis)' : p.grupo === 'despues' ? 'var(--oro)' : 'var(--olivo)'}" opacity=".85">
      <title>${esc(p.nombre)}: nace en el año ${p.nace}, muere en el ${p.muere} (${p.muere - p.nace} años)</title></rect>`; }).join('');
  const hitos = L.hitos.map(h => `<line x1="${x(h.anio)}" y1="30" x2="${x(h.anio)}" y2="${H - 30}" stroke="var(--cornalina)" stroke-dasharray="4 4"/><text x="${x(h.anio) + 4}" y="${H - 16}" font-size="11.5" fill="var(--cornalina)" font-family="var(--f-ui)">${esc(h.nombre)}</text>`).join('');
  return `<div class="hoja" style="max-width:none"><span class="ojo">Herramientas</span><h1 class="titulo">Línea de tiempo</h1>
    <p>${esc(L.explicacion)}</p><div class="svgcaja"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vida de los patriarcas">${ejes}${hitos}${barras}</svg></div>
    <div class="leyenda">Años contados desde la creación sumando las cifras del texto hebreo (RVR1960). Azul: antes del diluvio · Oro: de Sem a Taré · Verde: los patriarcas.</div>
    <div class="panel" style="margin-top:16px"><b>Una advertencia de las fuentes.</b> ${esc(L.advertencia)} ${chips(L.fuentes)}</div>
    <h2>Cómo se calcula</h2><table class="tabla"><thead><tr><th>Persona</th><th>Dato del texto</th><th>Año desde la creación</th></tr></thead><tbody>
    ${L.personas.map(p => `<tr><td>${esc(p.nombre)}</td><td>${esc(p.dato)}</td><td>${p.nace}–${p.muere}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- árboles ---------- */
function arbolSVG(raiz) {
  const ancho = n => n.hijos && n.hijos.length ? n.hijos.reduce((s, h) => s + ancho(h), 0) : 1;
  const prof = n => 1 + (n.hijos && n.hijos.length ? Math.max(...n.hijos.map(prof)) : 0);
  const CW = 118, CH = 74, total = ancho(raiz), W = total * CW + 20, H = prof(raiz) * CH + 20;
  let out = '';
  (function dib(n, x0, nivel) {
    const w = ancho(n) * CW, cx = x0 + w / 2, cy = 24 + nivel * CH;
    let x = x0;
    (n.hijos || []).forEach(h => { const hw = ancho(h) * CW, hx = x + hw / 2, hy = 24 + (nivel + 1) * CH;
      out += `<path d="M${cx},${cy + 14} V${cy + CH / 2} H${hx} V${hy - 16}" fill="none" stroke="var(--line)" stroke-width="1.5"/>`; dib(h, x, nivel + 1); x += hw; });
    const lw = Math.min(CW - 10, 14 + n.n.length * 7.2);
    out += `<g><rect x="${cx - lw / 2}" y="${cy - 14}" width="${lw}" height="28" rx="14" fill="${n.linea ? 'var(--oro-soft)' : 'var(--surface)'}" stroke="${n.linea ? 'var(--oro)' : 'var(--line)'}"/>
      <text x="${cx}" y="${cy + 4.5}" text-anchor="middle" font-size="12.5" font-family="var(--f-ui)" fill="var(--ink)" ${n.linea ? 'font-weight="600"' : ''}>${esc(n.n)}</text>
      ${n.nota ? `<text x="${cx}" y="${cy + 27}" text-anchor="middle" font-size="10" font-family="var(--f-ui)" fill="var(--muted)">${esc(n.nota)}</text>` : ''}</g>`;
  })(raiz, 10, 0);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Árbol genealógico">${out}</svg>`;
}
function vistaFamilias() {

function armarIndice() {
  indice = [];
  ARTS.forEach(a => { const x = artDe(a.id); if (!x) return;
    const push = (sec, t) => t && indice.push({ href: '#art-' + a.id, lab: tituloArt(a), sec, t });
    push('Entrada', x.entrada.texto);
    x.apartados.forEach(s => s.parrafos.forEach(q => push(s.titulo, q.texto)));
    (x.interpretaciones || []).forEach(i => i.posturas.forEach(p => push('Interpretación: ' + i.tema, p.quien + ': ' + p.postura)));
    (x.conexiones || []).forEach(k => push('Conexión: ' + k.ref, k.nota));
  });
  Object.entries(D.dias).forEach(([d, x]) => {
    const push = (sec, t) => t && indice.push({ href: '#dia-' + d, lab: 'Día ' + d, sec, t });
    push('Panorama', x.panorama.texto);
    x.secciones.forEach(s => s.notas.forEach(n => push(s.rango + ' · ' + s.titulo, n.texto)));
    x.palabras.forEach(w => push('Palabra: ' + w.translit, w.significado));
    x.cristo.forEach(k => push('Cristo en el pasaje', k.texto));
    x.interpretaciones.forEach(i => i.posturas.forEach(p => push('Interpretación: ' + i.tema, p.quien + ': ' + p.postura)));
    (x.biblioteca || []).forEach(b => push('Biblioteca: ' + b.autor, b.texto));
    x.profundizar.forEach(f => push('Profundizar: ' + f.titulo, f.texto));
  });
}
const sinTildes = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  }
});

/* ---------- introducción, partes y temas ---------- */
function estructuraLibro() {
  const max = Math.max(...D.toledot.map(t => t.versos));
  let h = '<div class="estructura" role="list" aria-label="Las secciones de Génesis">', pt = '';
  D.toledot.forEach(t => {
    const parte = (PLAN.find(p => p.dia === diaQueContiene(t.inicio)) || {}).parte;
    const a = ARTS.find(x => x.grupo === 'parte' && x.parte === parte);
    if (parte !== pt) { pt = parte; h += `<div class="pt" style="color:${COLOR_PARTE[parte]}">${esc(a ? a.titulo : 'Parte ' + parte)}</div>`; }
    h += `<a role="listitem" href="#dia-${diaQueContiene(t.inicio)}"><span class="et">${esc(t.titulo)}<small>${esc(t.etiqueta)} · Gn ${esc(t.rango)} · ${t.versos} versículos</small></span>
      <span class="b" style="width:${(100 * t.versos / max).toFixed(1)}%;background:${COLOR_PARTE[parte]}"></span></a>`;
  });
  return h + '</div>';
}

const palabrasDe = o => { let n = 0; JSON.stringify(o, (k, v) => { if (typeof v === 'string' && k !== 'fuentes' && k !== 'notas_no_usadas') n += v.split(/\s+/).length; return v; }); return n; };
function diasDeRefs(refs) {
  const ds = new Set();
  (refs || []).forEach(r => { const m = String(r).replace(/^G[ée]n?\.?\s*/i, '').match(/^(\d+):(\d+)/); if (m && +m[1] >= 1 && +m[1] <= 50) ds.add(diaQueContiene(m[1] + ':' + m[2])); });
  return [...ds].sort((a, b) => a - b);
}
function vistaArticulo(id) {
  const a = ARTS.find(x => x.id === id); if (!a) return vistaInicio();
  const x = artDe(id), grupo = ARTS.filter(y => y.grupo === a.grupo), i = grupo.indexOf(a);
  const ojo = { intro: `Introducción a Génesis · ${i + 1} de ${grupo.length}`, parte: `Panorama · Génesis ${a.rango}`, tema: `Temas de Génesis · ${i + 1} de ${grupo.length}` }[a.grupo];
  let h = `<article class="hoja"><span class="ojo">${esc(ojo)}</span><h1 class="titulo">${esc(tituloArt(a))}</h1>`;
  if (!x) return h + `<div class="panel pend-msg"><p><b>Esta sección está en preparación.</b> Se escribe con el material de la biblioteca, como los días.</p></div></article>`;
  h += `<p class="bajada">${esc(x.bajada)}</p><div class="meta"><span>≈ ${Math.max(3, Math.round(palabrasDe({ e: x.entrada, a: x.apartados }) / 200))} min de lectura</span></div>`;
  h += `<div class="entrada" style="margin-top:18px">${parr(x.entrada.texto)}${chips(x.entrada.fuentes)}</div>`;
  if (id === 'I2') h += estructuraLibro();
  if (a.grupo === 'parte') {
    const ds = PLAN.filter(p => p.parte === a.parte);
    h += `<div class="panel" style="margin:18px 0;padding:10px 8px"><span class="ojo" style="padding:0 8px">Los ${ds.length} días de esta parte</span>` +
      ds.map(p => `<a class="dia-l ${est.hechos[p.dia] ? 'hecho' : ''}" href="#dia-${p.dia}"><span class="n">${p.dia}</span><span>${esc(p.titulo)}</span><span class="r">${esc(p.desde)}–${esc(p.hasta)}</span></a>`).join('') + '</div>';
  }
  const versiculo = v => { const vt = D.rvr[v.ref];
    return vt ? `<figure class="clave"><blockquote>«${esc(vt).replace(/\n/g, ' / ')}»</blockquote><cite>Génesis ${esc(v.ref)} · RVR1960</cite>${v.porque ? `<p class="porque">${esc(v.porque)}</p>` : ''}</figure>` : ''; };
  const cita = c => `<figure class="cita"><blockquote>«${esc(c.texto)}»</blockquote><figcaption>${esc(c.autor)}, <i>${esc(c.obra)}</i> ${chips(c.fuentes)}</figcaption></figure>`;
  // los versículos clave y las citas se intercalan entre los apartados para que la lectura respire
  const vers = (x.versiculos || []).slice(), citas = (x.citas || []).slice();
  if (vers.length) h += versiculo(vers.shift());
  x.apartados.forEach((s, k) => {
    h += `<h2 id="ap-${k}">${esc(s.titulo)}</h2>` + s.parrafos.map(q => `<p class="nota">${esc(q.texto)} ${chips(q.fuentes)}</p>`).join('');
    if (s.destacado && s.destacado.texto) h += `<aside class="destacado"><span class="et">Para retener</span><p>${esc(s.destacado.texto)} ${chips(s.destacado.fuentes)}</p></aside>`;
    if (k === x.apartados.length - 1) return;
    if (k % 2 === 0 ? vers.length : !citas.length && vers.length) h += versiculo(vers.shift());
    else if (citas.length) h += cita(citas.shift());
  });
  vers.forEach(v => { h += versiculo(v); }); citas.forEach(c => { h += cita(c); });
  if (x.palabras && x.palabras.length) h += `<h2>Palabras para entender</h2><div class="palabras">` + x.palabras.map(w => `<div class="palabra">${w.hebreo ? `<span class="heb" lang="he">${esc(w.hebreo)}</span>` : ''}
    <span class="tr">${esc(w.translit)}</span> <span class="rf">· ${esc(w.ref)}</span><p>${esc(w.significado)} ${chips(w.fuentes)}</p></div>`).join('') + '</div>';
  if (x.interpretaciones && x.interpretaciones.length) h += `<h2>Preguntas difíciles e interpretaciones</h2>` + x.interpretaciones.map(q => `<details class="interp"><summary>${esc(q.tema)}</summary><div class="cuerpo">` +
    q.posturas.map(p => `<div class="postura"><span class="quien">${esc(p.quien)}</span><span>${esc(p.postura)} ${chips(p.fuentes)}</span></div>`).join('') +
    (q.nota ? `<p style="margin-top:10px;font-size:.92rem">${esc(q.nota)}</p>` : '') + '</div></details>').join('');
  if (x.conexiones && x.conexiones.length) h += `<h2>Conexiones con el resto de la Biblia</h2><div class="conex">` + x.conexiones.map(k => `<span class="rf">${esc(k.ref)}</span><span>${esc(k.nota)} ${chips(k.fuentes)}</span>`).join('') + '</div>';
  if ((x.para_vivir && x.para_vivir.length) || (x.para_conversar && x.para_conversar.length)) {
    h += `<section class="vida"><h2>Para la vida de ustedes</h2>${x.para_vivir.length ? `<ul>${x.para_vivir.map(v => `<li>${esc(v.texto)} ${chips(v.fuentes)}</li>`).join('')}</ul>` : ''}
      ${x.para_conversar.length ? `<h3>Para conversar</h3><ol>${x.para_conversar.map(q => `<li>${esc(q)}</li>`).join('')}</ol>` : ''}</section>`;
  }
  const ds = a.grupo === 'parte' ? [] : diasDeRefs(x.refs_genesis);
  if (ds.length) h += `<h2>Dónde aparece en el plan</h2><div class="en-plan">${ds.map(d => `<a class="btn" href="#dia-${d}">Día ${d} · Gn ${esc(diaPlan(d).desde)}</a>`).join('')}</div>`;
  const ant = grupo[i - 1], sig = grupo[i + 1];
  const fin = a.grupo === 'parte' ? { href: '#dia-' + PLAN.find(p => p.parte === a.parte).dia, t: 'Empezar la parte →' } : null;
  h += `<nav class="pie-dia">${ant ? `<a class="btn" href="#art-${ant.id}">← ${esc(tituloArt(ant))}</a>` : `<a class="btn" href="#${a.grupo === 'tema' ? 'temas' : 'introduccion'}">← Índice</a>`}
    ${fin ? `<a class="btn prim" href="${fin.href}">${fin.t}</a>` : sig ? `<a class="btn" href="#art-${sig.id}">${esc(tituloArt(sig))} →</a>` : a.grupo === 'intro' ? `<a class="btn prim" href="#dia-1">Empezar el día 1 →</a>` : ''}</nav></article>`;
  return h;
}
function ladoArticulo(id) {
  const x = artDe(id); if (!x || !x.apartados.length) return '';
  return `<div class="tarjeta toc"><h5>En esta sección</h5>${x.apartados.map((s, k) => `<a href="#art-${id}" data-ir="ap-${k}">${esc(s.titulo)}</a>`).join('')}</div>`;
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-ir]'); if (!a) return;
  e.preventDefault(); const el = document.getElementById(a.dataset.ir); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* ---------- ruteo ---------- */
function render() {
  const h = (location.hash || '#inicio').slice(1);
  rutaActual = h;
  let main = '', lado = '';
  const m = h.match(/^dia-(\d+)$/);
  if (m) { const d = +m[1]; main = vistaDia(d); lado = ladoDia(d); }
  else if (h === 'mapas') main = vistaMapas();
  else if (h === 'linea') main = vistaLinea();
  else if (h === 'familias') main = vistaFamilias();
  else if (h === 'palabras') main = vistaPalabras();
  else if (h === 'cristo') main = vistaCristo();
  else if (h === 'buscar') main = vistaBuscar();
  else if (h === 'fuentes') main = vistaFuentes();
  else if (h === 'introduccion') main = vistaIntro();
  else if (h === 'temas') main = vistaTemas();
  else if (/^art-[IPT]\d$/.test(h)) { main = vistaArticulo(h.slice(4)); lado = ladoArticulo(h.slice(4)); }
  else if (h === 'como-usar') main = vistaTexto(h);
  else { rutaActual = 'inicio'; main = vistaInicio(); }
  $('#principal').innerHTML = main;
  $('#lado').innerHTML = lado; $('#lado').hidden = !lado;
  document.querySelector('.app').style.gridTemplateColumns = lado ? '' : (innerWidth > 820 ? 'var(--cols-sin-lado, 290px minmax(0, 1fr))' : '');
  pintarNav(); pintarProgreso();
  const hb = $('#hecho-btn');
  if (hb) hb.onclick = async () => { const d = +m[1]; if (est.hechos[d]) delete est.hechos[d]; else est.hechos[d] = new Date().toISOString().slice(0, 10); render(); await escribirDia(d); };
  if (h === 'buscar') setTimeout(() => $('#q') && $('#q').focus(), 0);
  window.scrollTo(0, 0);
}
addEventListener('hashchange', render);
addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  const m = (location.hash || '').match(/^#dia-(\d+)$/); if (!m) return;
  const d = +m[1];
  if (e.key === 'ArrowRight' && d < TOTAL) location.hash = 'dia-' + (d + 1);
  if (e.key === 'ArrowLeft' && d > 1) location.hash = 'dia-' + (d - 1);
});
render();
})();
</script>
