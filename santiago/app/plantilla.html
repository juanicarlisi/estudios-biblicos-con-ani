<title>Santiago en pareja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Figtree:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Gentium+Plus:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Concepto: una carta. Santiago escribe «a las doce tribus que están en la dispersión»: el estudio se lee como una carta en tres columnas.
   A la izquierda el plan según las partes de la carta, al centro la lectura (~68 caracteres), a la derecha el contexto (lugar, lugar en la carta, palabras).
   Paleta: papiro, tinta azul verdosa (el mar y las olas de 1:6), terracota (el sello) y oliva (lo terminado). */
:root {
  --bg: #f3eee3; --surface: #fffdf8; --surface-2: #f8f3e7; --ink: #232019; --muted: #61594b; --line: #dbd2bf;
  --tinta: #1d4f61; --tinta-soft: #deeaed; --oro: #8f6410; --oro-soft: #f6ecd2; --terracota: #a3432a; --terracota-soft: #f7e5de;
  --oliva: #4d6428; --oliva-soft: #e8edd7; --sombra: 0 1px 2px rgba(35,32,25,.06), 0 8px 24px rgba(35,32,25,.07);
  --f-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-texto: "Literata", "Iowan Old Style", Georgia, serif;
  --f-ui: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-gr: "Gentium Plus", "Literata", "Times New Roman", serif;
  --f-heb: "Frank Ruhl Libre", "Times New Roman", serif;
  --texto: 1.06rem; --radio: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1413; --surface: #171e1d; --surface-2: #121817; --ink: #ebe6da; --muted: #a6aca3; --line: #2a3533;
  --tinta: #8fc4d4; --tinta-soft: #17303a; --oro: #e0b85a; --oro-soft: #2a2414; --terracota: #e8947a; --terracota-soft: #33201a;
  --oliva: #aac484; --oliva-soft: #1d2716; --sombra: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1413; --surface: #171e1d; --surface-2: #121817; --ink: #ebe6da; --muted: #a6aca3; --line: #2a3533;
  --tinta: #8fc4d4; --tinta-soft: #17303a; --oro: #e0b85a; --oro-soft: #2a2414; --terracota: #e8947a; --terracota-soft: #33201a;
  --oliva: #aac484; --oliva-soft: #1d2716; --sombra: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }
:root[data-size="grande"] { --texto: 1.18rem; }
:root[data-size="chica"] { --texto: .98rem; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
html { scroll-padding-top: 130px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--texto)/1.65 var(--f-texto); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--tinta); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; border-radius: 4px; }
.gr { font-family: var(--f-gr); }
.heb { font-family: var(--f-heb); direction: rtl; unicode-bidi: isolate; }

/* Barra superior y progreso global */
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); font-family: var(--f-ui); }
.marca { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.marca b { font: 600 1.45rem/1 var(--f-display); letter-spacing: .01em; white-space: nowrap; }
.marca .gr { color: var(--oro); font-size: 1rem; letter-spacing: .08em; }
.barra .esp { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font: 500 .86rem/1.2 var(--f-ui); cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--tinta); }
.btn.prim { background: var(--tinta); border-color: var(--tinta); color: var(--surface); }
.btn.oro { background: var(--oro-soft); border-color: var(--oro); color: var(--ink); }
.btn.chico { padding: 4px 10px; font-size: .8rem; }
.icono { width: 34px; height: 34px; padding: 0; justify-content: center; }
.anillo { display: flex; align-items: center; gap: 8px; font: 500 .82rem var(--f-ui); color: var(--muted); white-space: nowrap; }
.anillo svg { width: 30px; height: 30px; }
.menu-btn { display: none; }
.prog-global { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 54px); z-index: 19; height: 4px; background: var(--line); }
.prog-global i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--tinta), var(--oliva)); transition: width .4s ease; }

/* Estructura */
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr) 300px; gap: 28px; max-width: 1480px; margin: 0 auto;
  padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 96px); overflow-y: auto; font-family: var(--f-ui); padding-right: 4px; }
.nav h4 { font: 600 .72rem var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
.nav a.item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: .9rem; }
.nav a.item:hover { background: var(--surface); }
.nav a.item.actual { background: var(--tinta-soft); color: var(--tinta); font-weight: 600; }
.tol { margin-top: 10px; }
.tol summary { cursor: pointer; list-style: none; padding: 6px 8px; border-radius: 8px; }
.tol summary::-webkit-details-marker { display: none; }
.tol summary:hover { background: var(--surface); }
.tol .t1 { font: 600 .74rem var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--oro); }
.tol .t2 { display: block; font: 600 1.08rem/1.25 var(--f-display); color: var(--ink); }
.tol .t3 { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); }
.tol .minibar { height: 4px; background: var(--line); border-radius: 99px; margin-top: 5px; overflow: hidden; }
.tol .minibar i { display: block; height: 100%; background: var(--oliva); }
.dia-l { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: baseline; padding: 4px 8px; border-radius: 8px;
  text-decoration: none; color: var(--ink); font-size: .84rem; line-height: 1.3; }
.dia-l:hover { background: var(--surface); }
.dia-l .n { font: 600 .74rem var(--f-ui); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.dia-l .r { font-size: .72rem; color: var(--muted); white-space: nowrap; }
.dia-l.hecho .n { color: var(--oliva); }
.dia-l.hecho .n::before { content: "✓ "; }
.dia-l.actual { background: var(--tinta-soft); }
.dia-l.pend { opacity: .55; }
.principal { min-width: 0; }
.lado { position: sticky; top: 76px; align-self: start; display: grid; gap: 16px; max-height: calc(100vh - 96px); overflow-y: auto; }

/* Lectura */
.hoja { max-width: 72ch; margin: 0 auto; }
.hoja.ancha { max-width: none; }
.ojo { font: 600 .76rem var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--oro); }
h1.titulo { font: 600 clamp(2rem, 4vw, 2.9rem)/1.08 var(--f-display); margin: 6px 0 10px; text-wrap: balance; }
h2 { font: 600 1.7rem/1.15 var(--f-display); margin: 40px 0 12px; text-wrap: balance; }
h3 { font: 600 1.28rem/1.25 var(--f-display); margin: 26px 0 8px; text-wrap: balance; }
h3 .rango { font: 600 .78rem var(--f-ui); color: var(--tinta); background: var(--tinta-soft); border-radius: 999px; padding: 2px 9px; margin-right: 8px; vertical-align: middle; letter-spacing: .02em; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font: 500 .86rem var(--f-ui); color: var(--muted); }
.insignia { font: 600 .74rem var(--f-ui); letter-spacing: .04em; color: var(--terracota); background: var(--terracota-soft); border-radius: 999px; padding: 2px 10px; }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; }
p { margin: 0 0 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); padding: 18px 20px; }
.contexto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; margin: 22px 0; padding: 0; overflow: hidden; }
.contexto > div { padding: 14px 16px; border-right: 1px solid var(--line); min-width: 0; }
.contexto > div:last-child { border-right: 0; }
.contexto .et { font: 600 .7rem var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.contexto .ahora { background: var(--tinta-soft); }
.contexto p { font-size: .92rem; line-height: 1.5; margin: 0; }
.donde-cuando { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: -8px; }
.donde-cuando .panel { padding: 12px 16px; font-size: .9rem; line-height: 1.5; }
.clave { position: relative; margin: 26px 0; padding: 22px 24px 18px 28px; background: var(--oro-soft); border-radius: var(--radio); border-left: 4px solid var(--oro); }
.clave blockquote { margin: 0 0 10px; font: 500 1.42rem/1.38 var(--f-display); font-style: italic; }
.clave cite { font: 600 .8rem var(--f-ui); color: var(--oro); font-style: normal; letter-spacing: .04em; }
.clave .porque { font-size: .92rem; margin: 10px 0 0; color: var(--ink); }
.nota { margin: 0 0 14px; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 4px; vertical-align: 1px; }
.chip { font: 600 .66rem/1 var(--f-ui); letter-spacing: .03em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 7px;
  background: var(--surface); cursor: pointer; white-space: nowrap; }
.chip:hover, .chip[aria-expanded="true"] { color: var(--tinta); border-color: var(--tinta); }
.pop { position: absolute; z-index: 40; max-width: 340px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--sombra);
  padding: 10px 12px; font: 400 .82rem/1.45 var(--f-ui); }
.pop b { font-weight: 600; }
.pop div + div { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
.palabras { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.palabra { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); padding: 12px 14px; min-width: 0; }
.palabra .gr, .palabra .heb { display: block; font-size: 1.55rem; line-height: 1.25; color: var(--tinta); }
.palabra .heb { text-align: right; }
.palabra .tr { font: 600 .9rem var(--f-ui); }
.palabra .rf { font: 500 .72rem var(--f-ui); color: var(--muted); }
.palabra p { font-size: .88rem; line-height: 1.45; margin: 6px 0 0; }
.cristo { border-left: 3px solid var(--terracota); padding: 4px 0 4px 16px; margin: 0 0 14px; }
.eco { border-left: 3px solid var(--oro); padding: 4px 0 4px 16px; margin: 0 0 14px; }
.refs { font: 500 .78rem var(--f-ui); color: var(--terracota); }
.eco .refs { color: var(--oro); }
details.interp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); margin: 0 0 10px; }
details.interp summary { cursor: pointer; padding: 12px 16px; font: 600 1.05rem var(--f-display); list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details.interp summary::after { content: "+"; font-family: var(--f-ui); color: var(--muted); }
details.interp[open] summary::after { content: "–"; }
details.interp .cuerpo { padding: 0 16px 12px; }
.postura { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: .93rem; }
.postura .quien { font: 600 .8rem var(--f-ui); color: var(--tinta); }
.biblio { display: grid; gap: 12px; }
.biblio .panel { padding: 14px 16px; }
.biblio .autor { font: 600 .78rem var(--f-ui); color: var(--oliva); letter-spacing: .02em; display: block; margin-bottom: 4px; }
.conex { display: grid; grid-template-columns: 110px 1fr; gap: 6px 14px; font-size: .93rem; }
.conex .rf { font: 600 .82rem var(--f-ui); color: var(--tinta); }
.vida { background: var(--oliva-soft); border-radius: var(--radio); padding: 20px 22px; margin-top: 34px; }
.vida h2 { margin-top: 0; }
.vida ul { margin: 0 0 8px; padding-left: 20px; }
.vida li { margin-bottom: 8px; }
.vida h3 { margin-top: 18px; }
.orar { font-style: italic; }
details.prof { margin-top: 26px; }
details.prof > summary { cursor: pointer; font: 600 1.3rem var(--f-display); }
.notas-p textarea { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: var(--radio); padding: 12px; background: var(--surface); color: var(--ink);
  font: 400 .95rem/1.5 var(--f-texto); resize: vertical; }
.estado { font: 500 .76rem var(--f-ui); color: var(--muted); }
.pie-dia { display: flex; justify-content: space-between; gap: 12px; margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pend-msg { margin-top: 30px; }

/* Seguimiento del día: pasos y avance de lectura */
.seguimiento { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 18; margin: 0 -8px 18px; padding: 8px 10px 6px; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); font-family: var(--f-ui); }
.seguimiento ol { list-style: none; display: flex; gap: 4px; padding: 0; margin: 0 0 6px; overflow-x: auto; scrollbar-width: none; }
.seguimiento li { flex: 1 0 auto; }
.seguimiento a { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid transparent; color: var(--muted);
  text-decoration: none; font-size: .78rem; font-weight: 500; white-space: nowrap; }
.seguimiento a b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); font-size: .68rem; background: var(--surface); }
.seguimiento a.pasado { color: var(--oliva); }
.seguimiento a.pasado b { background: var(--oliva); border-color: var(--oliva); color: var(--surface); }
.seguimiento a.activo { color: var(--tinta); background: var(--tinta-soft); border-color: var(--tinta); }
.seguimiento a.activo b { background: var(--tinta); border-color: var(--tinta); color: var(--surface); }
.seguimiento .linea { height: 3px; background: var(--line); border-radius: 99px; overflow: hidden; }
.seguimiento .linea i { display: block; height: 100%; width: 0; background: var(--tinta); }
.seguimiento .quedan { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-top: 3px; }

/* Texto bíblico */
details.pasaje { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); margin: 18px 0; }
details.pasaje > summary { cursor: pointer; padding: 12px 16px; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  font: 600 .78rem var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--oro); }
details.pasaje > summary::-webkit-details-marker { display: none; }
details.pasaje > summary::after { content: "–"; font-size: 1.1rem; color: var(--muted); }
details.pasaje:not([open]) > summary::after { content: "+"; }
.pasaje-cuerpo { padding: 0 20px 16px; }
.versos { font: 400 1.08rem/1.75 var(--f-texto); }
.versos .v { display: inline; }
.versos .v sup, .vers-linea sup { font: 700 .66rem var(--f-ui); color: var(--tinta); margin: 0 3px 0 2px; vertical-align: super; }
.versos .v a.num { text-decoration: none; }
.versos .v.parrafo { display: block; margin-top: 8px; }
.versos .v.res { background: linear-gradient(transparent 62%, var(--oro-soft) 62%); }
.pie-pasaje { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; font: 500 .74rem var(--f-ui); color: var(--muted); }
.griego-v { margin: 6px 0 0 18px; font: 400 1.06rem/1.6 var(--f-gr); color: var(--tinta); }
.griego-v sup { font: 700 .62rem var(--f-ui); color: var(--muted); }
.vers-linea { margin: 0 0 12px; padding: 8px 12px; border-left: 3px solid var(--line); background: var(--surface-2); border-radius: 0 8px 8px 0;
  font: 400 .95rem/1.6 var(--f-texto); font-style: italic; color: var(--muted); }
.tog { font: 600 .74rem var(--f-ui); }
.tog[aria-pressed="true"] { background: var(--tinta); color: var(--surface); border-color: var(--tinta); }

/* Tira de versículos: avance por versículo */
.tira { display: grid; gap: 5px; font-family: var(--f-ui); }
.tira .cap { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: center; }
.tira .cap > span { font: 600 .68rem var(--f-ui); color: var(--muted); text-align: right; }
.tira .fila { display: grid; gap: 2px; }
.tira a.cel { height: 12px; border-radius: 3px; background: var(--line); display: block; position: relative; }
.tira a.cel:hover { outline: 2px solid var(--tinta); z-index: 1; }
.tira a.cel.hecho { background: var(--oliva); }
.tira a.cel.parcial { background: color-mix(in srgb, var(--oliva) 45%, var(--line)); }
.tira a.cel.esta { background: var(--tinta); }
.tira a.cel.ini { box-shadow: -2px 0 0 var(--surface); }
.tira.grande a.cel { height: 22px; border-radius: 4px; }
.tira.grande .cap > span { font-size: .8rem; }
.tira-leyenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 500 .72rem var(--f-ui); color: var(--muted); margin-top: 8px; }
.tira-leyenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }

/* Diagramas dentro del día */
.diagrama { margin: 24px 0; padding: 16px 18px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); }
.diagrama > .ojo { display: block; margin-bottom: 2px; }
.diagrama h3 { margin: 0 0 4px; }
.diagrama .desc { font-size: .9rem; color: var(--muted); margin: 0 0 12px; }
.dg-pasos { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.dg-paso { flex: 1 1 130px; min-width: 120px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; position: relative; font-size: .88rem; line-height: 1.4; }
.dg-paso b { display: block; font: 600 1rem var(--f-display); color: var(--tinta); margin-bottom: 2px; }
.dg-paso .rf { font: 600 .68rem var(--f-ui); color: var(--muted); display: block; margin-top: 4px; }
.dg-paso:not(:last-child)::after { content: "→"; position: absolute; right: -11px; top: 50%; transform: translateY(-50%); font: 700 1rem var(--f-ui); color: var(--oro); background: var(--surface); border-radius: 50%; z-index: 1; width: 16px; text-align: center; }
.dg-comp { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: .88rem; line-height: 1.4; }
.dg-comp .th { font: 600 .98rem var(--f-display); padding: 8px 12px; color: var(--surface); }
.dg-comp .c { padding: 8px 12px; border-top: 1px solid var(--line); background: var(--surface-2); }
.dg-comp .c.et { font: 600 .72rem var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface); }
.dg-esc { display: grid; gap: 6px; }
.dg-esc .esc { margin-left: calc(var(--n) * 4%); background: var(--surface-2); border: 1px solid var(--line); border-left: 4px solid var(--tinta); border-radius: 8px; padding: 7px 12px; font-size: .88rem; line-height: 1.4; }
.dg-esc .esc b { font: 600 .98rem var(--f-display); color: var(--tinta); }
.dg-img { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.dg-img .im { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-align: center; font-size: .84rem; line-height: 1.4; }
.dg-img .im svg { width: 46px; height: 46px; color: var(--tinta); }
.dg-img .im b { display: block; font: 600 1rem var(--f-display); }
.dg-img .im .rf { font: 600 .68rem var(--f-ui); color: var(--muted); }
.dg-fuentes { margin-top: 10px; font-size: .8rem; color: var(--muted); }

/* Anexos relacionados */
.anexos { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 8px 0 0; }
.anexos a { display: block; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); padding: 12px 14px; }

.bajada { font: 500 1.22rem/1.45 var(--f-display); font-style: italic; color: var(--muted); margin: 0 0 18px; text-wrap: pretty; }

.en-plan { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* Inicio */
.heroe { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 26px; }

.progreso-grande { margin: 8px 0 4px; }

.calor td, .calor th { padding: 4px 10px; text-align: center; }

.carta-dia { margin: 22px 0 6px; padding: 8px 12px; border-radius: 8px; background: var(--tinta-soft); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
