<title>El varón según Dios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,500;0,600;0,700;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Public+Sans:wght@400;500;600;700&family=Caveat:wght@500;700&family=Frank+Ruhl+Libre:wght@400;500&display=swap">
<style>
/* Concepto: el banco de trabajo. A la izquierda el plan por partes, al centro la lectura (~68 caracteres) con
   espacio para marcar, dibujar y anotar a mano, a la derecha las notas y el contexto del día.
   Paleta: acero templado, roble y bronce (el oficio de Jesús, el hierro que se afila con hierro). */
:root {
  --bg: #eceeea; --surface: #ffffff; --surface-2: #f5f6f3; --ink: #1d232b; --muted: #5b6470; --line: #d5d9d2;
  --acero: #2f5d62; --acero-soft: #e0ebea; --roble: #8b5a2b; --roble-soft: #f3e9dd; --bronce: #9a6d1f; --bronce-soft: #f4ecd9;
  --alerta: #9b3b2f; --ok: #3f6b3a; --ok-soft: #e4eedf; --sombra: 0 1px 2px rgba(29,35,43,.06), 0 8px 24px rgba(29,35,43,.07);
  --hl-amarillo: #fde68a; --hl-verde: #bbf7d0; --hl-celeste: #bae6fd; --hl-rosa: #fbcfe8; --tinta-nota: #2b4c7e;
  --f-display: "Zilla Slab", "Rockwell", Georgia, serif;
  --f-texto: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --f-ui: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mano: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --f-heb: "Frank Ruhl Libre", "Times New Roman", serif;
  --texto: 1.06rem; --radio: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101418; --surface: #171c22; --surface-2: #13181d; --ink: #e6e3dc; --muted: #a1a9b3; --line: #29313a;
  --acero: #86bcc1; --acero-soft: #18292c; --roble: #d6a06a; --roble-soft: #2a2017; --bronce: #ddb05a; --bronce-soft: #2a2414;
  --alerta: #e58b78; --ok: #a5c98f; --ok-soft: #1a2617; --sombra: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  --hl-amarillo: rgba(250,204,21,.38); --hl-verde: rgba(74,222,128,.32); --hl-celeste: rgba(56,189,248,.32); --hl-rosa: rgba(244,114,182,.32); --tinta-nota: #9cc3ff;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101418; --surface: #171c22; --surface-2: #13181d; --ink: #e6e3dc; --muted: #a1a9b3; --line: #29313a;
  --acero: #86bcc1; --acero-soft: #18292c; --roble: #d6a06a; --roble-soft: #2a2017; --bronce: #ddb05a; --bronce-soft: #2a2414;
  --alerta: #e58b78; --ok: #a5c98f; --ok-soft: #1a2617; --sombra: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  --hl-amarillo: rgba(250,204,21,.38); --hl-verde: rgba(74,222,128,.32); --hl-celeste: rgba(56,189,248,.32); --hl-rosa: rgba(244,114,182,.32); --tinta-nota: #9cc3ff;
  color-scheme: dark; }
:root[data-size="grande"] { --texto: 1.18rem; }
:root[data-size="chica"] { --texto: .98rem; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--texto)/1.66 var(--f-texto); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--acero); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--bronce); outline-offset: 2px; border-radius: 4px; }
.heb { font-family: var(--f-heb); direction: rtl; unicode-bidi: isolate; }

/* Barra superior */
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); font-family: var(--f-ui); }
.marca { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.marca b { font: 700 1.38rem/1 var(--f-display); letter-spacing: .005em; white-space: nowrap; }
.marca span { font: 500 .78rem var(--f-ui); color: var(--bronce); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.barra .esp { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font: 500 .86rem/1.2 var(--f-ui); cursor: pointer; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--acero); }
.btn.prim { background: var(--acero); border-color: var(--acero); color: var(--surface); }
.btn.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ink); }
.icono { width: 34px; height: 34px; padding: 0; justify-content: center; }
.anillo { display: flex; align-items: center; gap: 8px; font: 500 .82rem var(--f-ui); color: var(--muted); white-space: nowrap; }
.anillo svg { width: 30px; height: 30px; }
.menu-btn { display: none; }

/* Estructura */
.app { display: grid; grid-template-columns: 280px minmax(0, 1fr) 290px; gap: 28px; max-width: 1480px; margin: 0 auto;
  padding-block: 24px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 96px); overflow-y: auto; font-family: var(--f-ui); padding-right: 4px; }
.nav h4 { font: 600 .72rem var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
.nav a.item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: .9rem; }
.nav a.item:hover { background: var(--surface); }
.nav a.item.actual { background: var(--acero-soft); color: var(--acero); font-weight: 600; }
.parte-n { margin-top: 8px; }
.parte-n summary { cursor: pointer; list-style: none; padding: 6px 8px; border-radius: 8px; }
.parte-n summary::-webkit-details-marker { display: none; }
.parte-n summary:hover { background: var(--surface); }
.parte-n .t1 { font: 600 .72rem var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--bronce); }
.parte-n .t2 { display: block; font: 600 1.02rem/1.25 var(--f-display); color: var(--ink); }
.parte-n .t3 { display: flex; justify-content: space-between; font-size: .74rem; color: var(--muted); }
.dia-l { display: grid; grid-template-columns: 30px 1fr; gap: 6px; align-items: baseline; padding: 4px 8px; border-radius: 8px;
  text-decoration: none; color: var(--ink); font-size: .84rem; line-height: 1.3; }
.dia-l:hover { background: var(--surface); }
.dia-l .n { font: 600 .74rem var(--f-ui); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.dia-l.hecho .n { color: var(--ok); }
.dia-l.hecho .n::before { content: "✓ "; }
.dia-l.actual { background: var(--acero-soft); }
.dia-l.pend { opacity: .55; }
.principal { min-width: 0; }
.lado { position: sticky; top: 76px; align-self: start; display: grid; gap: 16px; max-height: calc(100vh - 96px); overflow-y: auto; }

/* Lectura */
.hoja { position: relative; max-width: 72ch; margin: 0 auto; }
.ojo { font: 600 .76rem var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--bronce); }
h1.titulo { font: 700 clamp(2rem, 4vw, 2.75rem)/1.08 var(--f-display); margin: 6px 0 10px; text-wrap: balance; }
h2 { font: 600 1.55rem/1.18 var(--f-display); margin: 38px 0 12px; text-wrap: balance; scroll-margin-top: 90px; }
h3 { font: 600 1.2rem/1.25 var(--f-display); margin: 24px 0 8px; text-wrap: balance; }
.bajada { font: 400 1.16rem/1.5 var(--f-texto); font-style: italic; color: var(--muted); margin: 0 0 16px; text-wrap: pretty; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; font: 500 .86rem var(--f-ui); color: var(--muted); }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; }
p { margin: 0 0 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); padding: 18px 20px; }
.entrada p:first-child::first-letter { float: left; font: 700 3.2rem/.86 var(--f-display); color: var(--roble); padding: 6px 8px 0 0; }
.clave { margin: 26px 0; padding: 20px 24px 16px 26px; background: var(--bronce-soft); border-radius: var(--radio); border-left: 4px solid var(--bronce); }
.clave blockquote { margin: 0 0 8px; font: 500 1.3rem/1.42 var(--f-texto); font-style: italic; }
.clave cite { font: 600 .8rem var(--f-ui); color: var(--bronce); font-style: normal; letter-spacing: .04em; }
.clave .porque { font-size: .92rem; margin: 8px 0 0; }
.lectura-b { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 18px 0; padding: 12px 16px;
  background: var(--acero-soft); border-radius: var(--radio); font: 500 .92rem var(--f-ui); }
.lectura-b b { font-weight: 700; }
.nota { margin: 0 0 14px; }
.destacado { margin: 18px 0 22px; padding: 14px 18px; border-radius: var(--radio); background: var(--acero-soft); border-left: 4px solid var(--acero); }
.destacado .et { font: 600 .7rem var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--acero); display: block; margin-bottom: 4px; }
.destacado p { margin: 0; }
figure.cita { margin: 28px 0; padding: 0 0 0 22px; border-left: 2px solid var(--roble); }
figure.cita blockquote { margin: 0 0 6px; font: 500 1.28rem/1.42 var(--f-display); font-style: italic; text-wrap: pretty; }
figure.cita figcaption { font: 500 .8rem var(--f-ui); color: var(--muted); }
.datos { display: grid; gap: 12px; }
.dato { display: grid; grid-template-columns: minmax(84px, auto) 1fr; gap: 4px 16px; align-items: start; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radio); padding: 14px 16px; }
.dato .valor { font: 700 1.5rem/1.1 var(--f-display); color: var(--roble); font-variant-numeric: tabular-nums; }
.dato p { margin: 0; font-size: .95rem; }
.dato .fte { grid-column: 2; font: 400 .76rem var(--f-ui); color: var(--muted); }
.modelo { margin: 30px 0; padding: 18px 20px; border-radius: var(--radio); background: var(--roble-soft); }
.modelo .ojo { color: var(--roble); }
.modelo h3 { margin: 4px 0 8px; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 4px; vertical-align: 1px; }
.chip { font: 600 .66rem/1 var(--f-ui); letter-spacing: .03em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 7px;
  background: var(--surface); cursor: pointer; white-space: nowrap; }
.chip:hover, .chip[aria-expanded="true"] { color: var(--acero); border-color: var(--acero); }
.pop { position: absolute; z-index: 40; max-width: 340px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--sombra);
  padding: 10px 12px; font: 400 .82rem/1.45 var(--f-ui); }
.pop div + div { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
.palabras { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.palabra { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); padding: 12px 14px; min-width: 0; }
.palabra .orig { display: block; font-size: 1.5rem; line-height: 1.2; color: var(--acero); }
.palabra .tr { font: 600 .9rem var(--f-ui); }
.palabra p { font-size: .88rem; line-height: 1.45; margin: 6px 0 0; }
details.interp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); margin: 0 0 10px; }
details.interp summary { cursor: pointer; padding: 12px 16px; font: 600 1.02rem var(--f-display); list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details.interp summary::after { content: "+"; font-family: var(--f-ui); color: var(--muted); }
details.interp[open] summary::after { content: "–"; }
details.interp .cuerpo { padding: 0 16px 12px; }
.postura { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: .93rem; }
.postura .quien { font: 600 .8rem var(--f-ui); color: var(--acero); }
.conex { display: grid; grid-template-columns: 120px 1fr; gap: 6px 14px; font-size: .93rem; }
.conex .rf { font: 600 .82rem var(--f-ui); color: var(--acero); }
.vida { background: var(--ok-soft); border-radius: var(--radio); padding: 20px 22px; margin-top: 34px; }
.vida h2 { margin-top: 0; }
.vida ul, .vida ol { margin: 0 0 8px; padding-left: 20px; }
.vida li { margin-bottom: 8px; }
.vida h3 { margin-top: 18px; }
.orar { font-style: italic; }
details.prof { margin-top: 26px; }
details.prof > summary { cursor: pointer; font: 600 1.25rem var(--f-display); }
.notas-p textarea, .anot-nota textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--radio); background: var(--surface); color: var(--ink); resize: vertical; }
.notas-p textarea { min-height: 120px; padding: 12px; font: 500 1.25rem/1.35 var(--f-mano); color: var(--tinta-nota); }
.estado { font: 500 .76rem var(--f-ui); color: var(--muted); }
.pie-dia { display: flex; justify-content: space-between; gap: 12px; margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--line); }
.aviso-parte { margin: 0 0 18px; padding: 14px 16px; border-radius: var(--radio); background: var(--roble-soft); border: 1px solid var(--roble); font: 400 .95rem/1.5 var(--f-texto); }
.aviso-parte b { font: 700 1.05rem var(--f-display); display: block; margin-bottom: 2px; }

/* Marcas: resaltado, notas a mano y dibujo */
mark.hl { color: inherit; border-radius: 2px; padding: 0 1px; cursor: pointer; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
mark.hl-amarillo { background: var(--hl-amarillo); }
mark.hl-verde { background: var(--hl-verde); }
mark.hl-celeste { background: var(--hl-celeste); }
mark.hl-rosa { background: var(--hl-rosa); }
mark.hl.con-nota { text-decoration: underline dotted var(--tinta-nota) 2px; text-underline-offset: 3px; }
.anot-nota { position: relative; margin: -6px 0 16px; padding: 4px 30px 4px 14px; border-left: 3px solid var(--tinta-nota); }
.anot-nota textarea { border: 0; background: transparent; padding: 2px 0; min-height: 34px; font: 500 1.28rem/1.3 var(--f-mano); color: var(--tinta-nota); overflow: hidden; resize: none; }
.anot-nota .x { position: absolute; top: 2px; right: 0; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 4px 6px; }
.anot-nota .cita-hl { display: block; font: 500 .74rem var(--f-ui); color: var(--muted); margin-bottom: 2px; }
.nota-estatica { font: 500 1.28rem/1.3 var(--f-mano); color: var(--tinta-nota); white-space: pre-wrap; }
svg.lienzo { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 5; overflow: visible; }
body.modo-lapiz svg.lienzo, body.modo-borrador svg.lienzo { pointer-events: auto; touch-action: none; cursor: crosshair; }
body.modo-borrador svg.lienzo { cursor: cell; }
.sel-pop { position: absolute; z-index: 45; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; box-shadow: var(--sombra); font: 500 .8rem var(--f-ui); }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.sw[data-c="amarillo"] { background: #facc15; } .sw[data-c="verde"] { background: #4ade80; } .sw[data-c="celeste"] { background: #38bdf8; } .sw[data-c="rosa"] { background: #f472b6; }
.sel-pop .txt { border: 0; background: none; cursor: pointer; padding: 4px 6px; border-radius: 6px; font: 600 .8rem var(--f-ui); color: var(--ink); }
.sel-pop .txt:hover { background: var(--surface-2); }
.herramientas { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 4px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--sombra);
  font-family: var(--f-ui); max-width: calc(100vw - 24px); overflow-x: auto; }
.herramientas button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; border-radius: 999px; padding: 7px 10px; cursor: pointer;
  font: 600 .8rem var(--f-ui); color: var(--ink); white-space: nowrap; }
.herramientas button:hover { background: var(--surface-2); }
.herramientas button[aria-pressed="true"] { background: var(--acero); color: var(--surface); }
.herramientas .sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 2px; }
.herramientas .tinta { width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.herramientas .tinta[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--acero); }
.herramientas .confirmar { color: var(--alerta); }

/* Columna de contexto */
.tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); padding: 14px; font-family: var(--f-ui); font-size: .85rem; }
.tarjeta h5 { margin: 0 0 8px; font: 600 .72rem var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tarjeta .marca-i { display: block; padding: 6px 0; border-top: 1px dashed var(--line); color: var(--ink); text-decoration: none; font: 400 .86rem/1.4 var(--f-texto); }
.tarjeta .marca-i:first-of-type { border-top: 0; }
.toc a { display: block; padding: 4px 0; color: var(--ink); text-decoration: none; line-height: 1.3; }
.toc a:hover { color: var(--acero); }

/* Inicio */
.heroe { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 26px; }
.heroe h1 { font: 700 clamp(2.4rem, 5.5vw, 3.9rem)/1 var(--f-display); margin: 0 0 12px; text-wrap: balance; }
.heroe p { color: var(--muted); max-width: 52ch; }
.hoy { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; box-shadow: var(--sombra); }
.hoy .ojo { display: block; margin-bottom: 4px; }
.hoy h2 { margin: 0 0 6px; font-size: 1.7rem; }
.partes { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin: 18px 0; }
.parte { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radio); padding: 12px 14px; font-family: var(--f-ui); text-decoration: none; color: var(--ink); }
.parte:hover { border-color: var(--acero); }
.parte small { color: var(--muted); font-size: .74rem; }
.parte b { display: block; font: 600 1.05rem/1.25 var(--f-display); margin: 2px 0 6px; }
.parte .bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 4px; }
.parte .bar i { display: block; height: 100%; background: var(--ok); }
.copia { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 20px; align-items: center; margin-top: 30px; }
.copia b { font: 600 1.12rem var(--f-display); }
.copia p { margin: 4px 0 0; font-size: .92rem; color: var(--muted); }
.copia .acciones { margin: 0; }
.copia .estado { grid-column: 1 / -1; }

/* Herramientas generales */
.buscar input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radio); background: var(--surface); color: var(--ink); font: 400 1rem var(--f-ui); }
.resultado { padding: 12px 0; border-bottom: 1px solid var(--line); }
.tabla { width: 100%; border-collapse: collapse; font: 400 .86rem var(--f-ui); }
.tabla th, .tabla td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tabla th { font-weight: 600; color: var(--muted); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; }
.lista-pal { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

@media (max-width: 1180px) {
  .app { grid-template-columns: 250px minmax(0, 1fr); }
  .lado { position: static; grid-column: 2; max-height: none; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); padding-block: 16px 104px; }
  .lado { grid-column: 1; }
  .nav { position: fixed; inset: 0 auto 0 0; z-index: 35; width: min(86vw, 330px); max-height: none; background: var(--bg); padding: 70px 16px 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); transform: translateX(-105%); transition: transform .2s ease; box-shadow: var(--sombra); }

<script>
(() => {
/* La copia intacta del documento, para «Guardar el estudio con mis marcas» (antes de dibujar nada) */
const PRISTINO = '<!doctype html>\n' + document.documentElement.outerHTML;
const D = window.DATOS;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PLAN = D.plan, TOTAL = PLAN.length;
const hoyISO = () => new Date().toISOString();

/* ---------- estado: avance, notas, marcas y trazos ---------- */
const LS = 'varon-segun-dios-v1';
const vacio = () => ({ hechos: {}, notasDia: {}, marcas: {}, notas: {}, trazos: {}, actualizado: '' });
let est = vacio();
let local = null; try { local = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) {}
let embebido = null; try { embebido = JSON.parse($('#estado-inicial').textContent || 'null'); } catch (e) {}
let avisoCarga = '';
if (embebido && embebido.guardado && (!local || !local.actualizado || embebido.guardado > local.actualizado)) {
  est = Object.assign(vacio(), embebido); avisoCarga = 'Se cargaron las marcas guardadas en este archivo (' + embebido.guardado.slice(0, 10) + ').';
} else if (local) est = Object.assign(vacio(), local);
let avisoGuardado = '';
const guardar = () => { est.actualizado = hoyISO(); try { localStorage.setItem(LS, JSON.stringify(est)); avisoGuardado = ''; } catch (e) { avisoGuardado = 'El navegador no deja guardar más: descargá una copia.'; } };
const lista = (obj, d) => (obj[d] = obj[d] || []);
const nuevoId = () => Math.random().toString(36).slice(2, 9);

/* ---------- preferencias ---------- */
const PREF = 'varon-segun-dios-pref';
let pref = {}; try { pref = JSON.parse(localStorage.getItem(PREF) || '{}'); } catch (e) {}
const aplicarPref = () => {
  if (pref.tema) document.documentElement.dataset.theme = pref.tema; else delete document.documentElement.dataset.theme;
  if (pref.tam) document.documentElement.dataset.size = pref.tam; else delete document.documentElement.dataset.size;
};
const guardarPref = () => { try { localStorage.setItem(PREF, JSON.stringify(pref)); } catch (e) {} };
aplicarPref();
$('#tema-btn').onclick = () => { const osc = pref.tema ? pref.tema === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; pref.tema = osc ? 'light' : 'dark'; aplicarPref(); guardarPref(); setTimeout(dibujarTrazos, 50); };
$('#tam-btn').onclick = () => { pref.tam = { undefined: 'grande', grande: 'chica', chica: undefined }[pref.tam]; aplicarPref(); guardarPref(); setTimeout(dibujarTrazos, 50); };
$('#menu-btn').onclick = () => document.body.classList.toggle('nav-abierta');

/* ---------- utilidades ---------- */
const diaPlan = d => PLAN[d - 1];
const hayDia = d => !!D.dias[d];
const parteDe = id => D.partes.find(p => p.id === id);
const siguientePendiente = () => (PLAN.find(p => !est.hechos[p.dia]) || PLAN[TOTAL - 1]).dia;
const bg = ref => 'https://www.biblegateway.com/passage/?search=' + encodeURIComponent(ref) + '&version=RVR1960';
function chips(ids) {
  if (!ids || !ids.length) return '';
  const vistos = {};
  ids.forEach(id => { const f = D.fuentes[id]; if (f) (vistos[f[0]] = vistos[f[0]] || []).push(id); });
  return '<span class="chips">' + Object.keys(vistos).map(k => `<button class="chip" data-ids="${esc(vistos[k].join(' '))}" aria-expanded="false">${esc(k)}</button>`).join('') + '</span>';
}
let popAbierto = null;
const cerrarPop = () => { if (popAbierto) { popAbierto.remove(); $$('.chip[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false')); popAbierto = null; } };
document.addEventListener('click', e => {
  const c = e.target.closest('.chip');
  cerrarPop();
  if (c) {
    const pop = document.createElement('div'); pop.className = 'pop'; pop.setAttribute('role', 'dialog');
    pop.innerHTML = c.dataset.ids.split(' ').map(id => { const f = D.fuentes[id]; if (!f) return '';
      const enlace = f[3] ? ` <a href="${esc(f[3])}" target="_blank" rel="noopener">abrir ↗</a>` : '';
      return `<div><b>${esc(f[1])}</b><br>${esc(f[2] || '')}${enlace}</div>`; }).join('');
    document.body.appendChild(pop);
    const r = c.getBoundingClientRect(); const w = Math.min(340, innerWidth - 32);
    pop.style.width = w + 'px'; pop.style.left = Math.max(16, Math.min(innerWidth - w - 16, r.left + scrollX)) + 'px'; pop.style.top = (r.bottom + scrollY + 6) + 'px';
    c.setAttribute('aria-expanded', 'true'); popAbierto = pop; e.stopPropagation();
  }
  if (e.target.closest('.nav a')) document.body.classList.remove('nav-abierta');
});
const parr = t => esc(t).split(/\n{2,}/).map(x => `<p class="ak">${x.replace(/\n/g, '<br>')}</p>`).join('');
const minutosDe = x => x.minutos && x.minutos.estudio ? x.minutos.estudio : null;

/* ---------- progreso y navegación ---------- */
function pintarProgreso() {
  const hechos = Object.keys(est.hechos).length, p = hechos / TOTAL, R = 12, C = 2 * Math.PI * R;
  $('#anillo').innerHTML = `<svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="${R}" fill="none" stroke="var(--line)" stroke-width="4"/>
    <circle cx="15" cy="15" r="${R}" fill="none" stroke="var(--ok)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C * p} ${C}" transform="rotate(-90 15 15)"/></svg><span>${hechos} de ${TOTAL} días</span>`;
}
let rutaActual = '';
function pintarNav() {
  const actual = rutaActual;
  const it = (h, t) => `<a class="item ${actual === h ? 'actual' : ''}" href="#${h}">${t}</a>`;
  let h = it('inicio', 'Inicio') + it('como-usar', 'Cómo usar el estudio') + it('marcas', 'Mis marcas y notas');
  h += '<h4>El plan</h4>';
  D.partes.forEach(pt => {
    const dias = PLAN.filter(p => p.parte === pt.id); if (!dias.length) return;
    const hechos = dias.filter(p => est.hechos[p.dia]).length;
    const abierto = dias.some(p => actual === 'dia-' + p.dia) || (actual === 'inicio' && dias.some(p => p.dia === siguientePendiente()));
    h += `<details class="parte-n" ${abierto ? 'open' : ''}><summary><span class="t1">Parte ${esc(pt.numero)}</span><span class="t2">${esc(pt.titulo)}</span>
      <span class="t3"><span>Días ${dias[0].dia}–${dias[dias.length - 1].dia}</span><span>${hechos}/${dias.length}</span></span></summary>` +
      dias.map(p => `<a class="dia-l ${est.hechos[p.dia] ? 'hecho' : ''} ${actual === 'dia-' + p.dia ? 'actual' : ''} ${hayDia(p.dia) ? '' : 'pend'}" href="#dia-${p.dia}"><span class="n">${p.dia}</span><span>${esc(p.titulo)}</span></a>`).join('') + '</details>';
  });
  h += '<h4>Herramientas</h4>' + it('datos', 'Los datos de la crisis') + it('modelos', 'Varones de la Biblia y la historia') + it('palabras', 'Palabras griegas y hebreas') + it('buscar', 'Buscar') + it('fuentes', 'Fuentes del estudio');
  $('#nav').innerHTML = h;
}

/* ---------- vistas ---------- */
function vistaInicio() {
  const d = siguientePendiente(), p = diaPlan(d), hechos = Object.keys(est.hechos).length;
  const partes = D.partes.map(pt => { const ds = PLAN.filter(x => x.parte === pt.id); if (!ds.length) return '';
    const h = ds.filter(x => est.hechos[x.dia]).length;
    return `<a class="parte" href="#dia-${ds[0].dia}"><small>Parte ${esc(pt.numero)} · ${ds.length} días</small><b>${esc(pt.titulo)}</b><div class="bar"><i style="width:${100 * h / ds.length}%"></i></div><small>${h} de ${ds.length} terminados</small></a>`; }).join('');
  return `<div class="hoja" style="max-width:none">
    <section class="heroe"><div><span class="ojo">Un estudio diario, de 20 a 30 minutos</span><h1>El varón según el diseño de Dios</h1>
      <p>Quién te hizo y para qué, y cómo vivirlo con Dios, en tu casa, en el trabajo, en la iglesia y en la sociedad, en cada etapa de la vida. Todo sale de los libros de tu biblioteca y de fuentes confiables, con la fuente de cada afirmación.</p>${avisoCarga ? `<p class="estado">${esc(avisoCarga)}</p>` : ''}</div>
      <div class="hoy"><span class="ojo">${hechos ? 'Seguís con' : 'Para empezar'} · Día ${d} de ${TOTAL}</span><h2>${esc(p.titulo)}</h2>
        <div class="meta"><span>Parte ${esc(parteDe(p.parte).numero)} · ${esc(parteDe(p.parte).titulo)}</span></div>
        <div class="acciones"><a class="btn prim" href="#dia-${d}">Abrir el día ${d}</a><a class="btn" href="#como-usar">Cómo usarlo</a></div></div></section>
    <h2>Las partes del estudio</h2><div class="partes">${partes}</div>
    <section class="copia panel"><div><b>Tus marcas, notas y avance</b><p>Se guardan en el navegador de esta compu. Con el botón de guardar (arriba, el disquete) bajás el estudio completo con todas tus marcas adentro; también podés bajar solo una copia de tus marcas para pasarla a otra compu.</p></div>
      <div class="acciones"><button class="btn prim" id="guardar-html-2">Guardar el estudio con mis marcas</button><button class="btn" id="bajar-copia">Copia de mis marcas</button><button class="btn" id="cargar-copia-btn">Cargar copia</button>
      <input type="file" id="cargar-copia" accept=".json,application/json" hidden></div><div class="estado" id="estado-copia">${esc(avisoGuardado)}</div></section></div>`;
}
function bloqueNotas(d) {
  return `<section class="notas-p"><h2>Tus notas del día</h2><textarea id="notas-dia" data-dia="${d}" placeholder="Lo que Dios te mostró, lo que vas a hacer, por qué vas a orar…">${esc(est.notasDia[d] || '')}</textarea>
    <div class="estado" id="estado-notas">Se guarda en esta compu.</div></section>`;
}
function vistaDia(d) {
  const p = diaPlan(d); if (!p) return vistaInicio();
  const x = D.dias[d], pt = parteDe(p.parte);
  const ant = d > 1 ? diaPlan(d - 1) : null, sig = d < TOTAL ? diaPlan(d + 1) : null;
  const empiezaParte = !ant || ant.parte !== p.parte;
  let h = `<article class="hoja" id="hoja" data-dia="${d}">`;
  if (empiezaParte) h += `<div class="aviso-parte"><b>Parte ${esc(pt.numero)} · ${esc(pt.titulo)}</b>${esc(pt.bajada || '')}</div>`;
  h += `<span class="ojo">Parte ${esc(pt.numero)} · Día ${d} de ${TOTAL}</span><h1 class="titulo">${esc(x ? x.titulo : p.titulo)}</h1>`;
  if (!x) return h + `<div class="panel"><p><b>Este día está en preparación.</b> Se está escribiendo con el material de la biblioteca.</p></div></article>`;
  if (x.bajada) h += `<p class="bajada">${esc(x.bajada)}</p>`;
  h += `<div class="meta">${minutosDe(x) ? `<span>≈ ${minutosDe(x)} min de estudio</span>` : ''}${x.lectura && x.lectura.pasaje ? `<span>Lectura: ${esc(x.lectura.pasaje)}</span>` : ''}</div>
    <div class="acciones no-imprimir"><button class="btn ${est.hechos[d] ? 'ok' : ''}" id="hecho-btn">${est.hechos[d] ? '✓ Terminado' : 'Marcar como terminado'}</button></div>`;
  if (x.lectura && x.lectura.pasaje) h += `<div class="lectura-b"><span>Antes de empezar, leé <b>${esc(x.lectura.pasaje)}</b>${x.lectura.porque ? ' · ' + esc(x.lectura.porque) : ''}</span><a class="btn no-imprimir" href="${bg(x.lectura.pasaje)}" target="_blank" rel="noopener">Leer en RVR1960 ↗</a></div>`;
  const vers = (x.versiculos || []).slice(), citas = (x.citas || []).slice();
  const versiculo = v => { const t = D.rvr[v.ref]; return t ? `<figure class="clave"><blockquote class="ak">«${esc(t)}»</blockquote><cite>${esc(v.ref)} · RVR1960</cite>${v.porque ? `<p class="porque ak">${esc(v.porque)}</p>` : ''}</figure>` : ''; };
  const cita = c => `<figure class="cita"><blockquote class="ak">«${esc(c.texto)}»</blockquote><figcaption>${esc(c.autor)}${c.obra ? ', <i>' + esc(c.obra) + '</i>' : ''} ${chips(c.fuentes)}</figcaption></figure>`;
  if (vers.length) h += versiculo(vers.shift());
  h += `<div class="entrada">${parr(x.entrada.texto)}${chips(x.entrada.fuentes)}</div>`;
  x.apartados.forEach((s, k) => {
    h += `<h2 id="ap-${k}">${esc(s.titulo)}</h2>` + s.parrafos.map(q => `<p class="nota ak">${esc(q.texto)} ${chips(q.fuentes)}</p>`).join('');
    if (s.destacado && s.destacado.texto) h += `<aside class="destacado"><span class="et">Para retener</span><p class="ak">${esc(s.destacado.texto)} ${chips(s.destacado.fuentes)}</p></aside>`;
    if (k === x.apartados.length - 1) return;
    if (k % 2 === 0 ? vers.length : !citas.length && vers.length) h += versiculo(vers.shift());
    else if (citas.length) h += cita(citas.shift());
  });
  vers.forEach(v => { h += versiculo(v); }); citas.forEach(c => { h += cita(c); });
  if (x.datos && x.datos.length) h += `<h2>Los datos</h2><div class="datos">` + x.datos.map(dt => `<div class="dato">${dt.valor ? `<span class="valor">${esc(dt.valor)}</span>` : '<span></span>'}<p class="ak">${esc(dt.texto)}</p><span class="fte">${chips(dt.fuentes)}</span></div>`).join('') + '</div>';
  if (x.modelo && x.modelo.texto) h += `<section class="modelo"><span class="ojo">Un varón para mirar</span><h3>${esc(x.modelo.persona)}</h3><p class="ak">${esc(x.modelo.texto)} ${chips(x.modelo.fuentes)}</p>${x.modelo.refs && x.modelo.refs.length ? `<span class="estado">${esc(x.modelo.refs.join(' · '))}</span>` : ''}</section>`;
  if (x.palabras && x.palabras.length) h += `<h2>Palabras para entender</h2><div class="palabras">` + x.palabras.map(w => `<div class="palabra">${w.original ? `<span class="orig ${w.idioma === 'hebreo' ? 'heb' : ''}" lang="${w.idioma === 'hebreo' ? 'he' : 'el'}">${esc(w.original)}</span>` : ''}<span class="tr">${esc(w.translit)}</span> <span class="estado">· ${esc(w.ref || '')}</span><p class="ak">${esc(w.significado)} ${chips(w.fuentes)}</p></div>`).join('') + '</div>';
  if (x.interpretaciones && x.interpretaciones.length) h += `<h2>Preguntas difíciles</h2>` + x.interpretaciones.map(i => `<details class="interp"><summary>${esc(i.tema)}</summary><div class="cuerpo">` +
    i.posturas.map(q => `<div class="postura"><span class="quien">${esc(q.quien)}</span><span class="ak">${esc(q.postura)} ${chips(q.fuentes)}</span></div>`).join('') + (i.nota ? `<p class="ak" style="margin-top:10px;font-size:.92rem">${esc(i.nota)}</p>` : '') + '</div></details>').join('');
  if (x.conexiones && x.conexiones.length) h += `<h2>En toda la Biblia</h2><div class="conex">` + x.conexiones.map(k => `<span class="rf">${esc(k.ref)}</span><span class="ak">${esc(k.nota)} ${chips(k.fuentes)}</span>`).join('') + '</div>';

  const svg = e.target.closest('#lienzo'); if (!svg) return;
  if (modo === 'lapiz') { e.preventDefault(); svg.setPointerCapture(e.pointerId); trazo = { pts: [puntoLocal(e)], el: document.createElementNS('http://www.w3.org/2000/svg', 'path') };
    const ti = TINTAS[tinta]; Object.entries({ fill: 'none', stroke: ti.c, 'stroke-width': ti.s, 'stroke-opacity': ti.o, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }).forEach(([k, v]) => trazo.el.setAttribute(k, v)); svg.appendChild(trazo.el); }
  if (modo === 'borrador') { e.preventDefault(); svg.setPointerCapture(e.pointerId); borrarCerca(puntoLocal(e)); window._borrando = true; }
});
document.addEventListener('pointermove', e => {
  if (trazo) { const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; evs.forEach(ev => trazo.pts.push(puntoLocal(ev))); trazo.el.setAttribute('d', camino(trazo.pts)); }
  else if (window._borrando && modo === 'borrador') borrarCerca(puntoLocal(e));
});
document.addEventListener('pointerup', () => {
  window._borrando = false;
  if (!trazo) return;
  const t = trazo; trazo = null; if (t.pts.length < 2) { t.el.remove(); return; }
  const bloques = rectBloques(); const [x0, y0] = t.pts[0];
  let b = bloques.find(q => y0 >= q.y && y0 <= q.y + q.h) || bloques.reduce((m, q) => Math.abs(q.y + q.h / 2 - y0) < Math.abs(m.y + m.h / 2 - y0) ? q : m, bloques[0]);
  if (!b) return;
  const d = diaVisible(); lista(est.trazos, d).push({ id: nuevoId(), k: b.k, bw: +b.w.toFixed(1), bh: +b.h.toFixed(1), c: tinta, pts: t.pts.map(p => [+(p[0] - b.x).toFixed(1), +(p[1] - b.y).toFixed(1)]) });
  guardar(); dibujarTrazos(); pintarLado();
});
function borrarCerca([x, y]) {
  const d = diaVisible(); const ts = est.trazos[d] || []; const antes = ts.length;
  est.trazos[d] = ts.filter(t => { const pts = posCache[t.id] || []; return !pts.some((p, i) => { const q = pts[i + 1] || p; return distSeg(x, y, p, q) < 10; }); });
  if (est.trazos[d].length !== antes) { guardar(); dibujarTrazos(); pintarLado(); }
}
function distSeg(x, y, p, q) { const dx = q[0] - p[0], dy = q[1] - p[1]; const l = dx * dx + dy * dy; let t = l ? ((x - p[0]) * dx + (y - p[1]) * dy) / l : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(x - (p[0] + t * dx), y - (p[1] + t * dy)); }
let tRes = null; addEventListener('resize', () => { clearTimeout(tRes); tRes = setTimeout(dibujarTrazos, 150); });

/* ---------- descargar el día, imprimir y guardar el estudio ---------- */
function bajar(nombre, contenido, tipo) {
  const url = URL.createObjectURL(new Blob([contenido], { type: tipo }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 3000);
}
const fechaArchivo = () => new Date().toISOString().slice(0, 10);
function descargarDia() {
  const d = diaVisible(); if (!d) return;
  dibujarTrazos();
  const hoja = $('#hoja'); const ancho = hoja.offsetWidth;
  const copia = hoja.cloneNode(true);
  copia.querySelectorAll('.no-imprimir, .acciones, .pie-dia, #hecho-btn').forEach(x => x.remove());
  copia.querySelectorAll('details').forEach(x => x.setAttribute('open', ''));
  copia.querySelectorAll('.anot-nota').forEach(n => { const ta = n.querySelector('textarea'); const div = document.createElement('div'); div.className = 'nota-estatica'; div.textContent = ta ? ta.value : ''; ta && ta.replaceWith(div); n.querySelector('.x') && n.querySelector('.x').remove(); });
  const ta = copia.querySelector('#notas-dia'); if (ta) { const div = document.createElement('div'); div.className = 'nota-estatica'; div.textContent = ta.value || ''; ta.replaceWith(div); }
  const usadas = new Map();
  copia.querySelectorAll('.chip').forEach(c => { c.dataset.ids.split(' ').forEach(id => { const f = D.fuentes[id]; if (f && !usadas.has(id)) usadas.set(id, f); }); const s = document.createElement('span'); s.className = 'chip'; s.textContent = c.textContent; c.replaceWith(s); });
  const fuentesHtml = `<section style="margin-top:30px"><h2>Fuentes de este día</h2><ul style="font:400 .85rem/1.5 var(--f-ui)">${[...usadas.values()].map(f => `<li><b>${esc(f[0])}</b>: ${esc(f[1])}${f[2] ? ', ' + esc(f[2]) : ''}${f[3] ? ` · <a href="${esc(f[3])}">${esc(f[3])}</a>` : ''}</li>`).join('')}</ul><p class="estado">${esc(D.aviso_rvr)}</p></section>`;
  const css = $$('style').map(s => s.textContent).join('\n');
  const tema = document.documentElement.dataset.theme ? ` data-theme="${document.documentElement.dataset.theme}"` : '';
  const html = `<!doctype html>\n<html lang="es"${tema}><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Día ${d} · ${esc(diaPlan(d).titulo)} · El varón según Dios</title><style>${css}\n.hoja{width:${ancho}px;max-width:none}</style></head><body class="exportado"><main>${copia.outerHTML}${fuentesHtml}</main></body></html>`;
  bajar(`Varon-segun-Dios-dia-${String(d).padStart(3, '0')}.html`, html, 'text/html');
}
$('#t-descargar').onclick = descargarDia;
$('#t-imprimir').onclick = () => { $$('#hoja details').forEach(x => x.setAttribute('open', '')); dibujarTrazos(); setTimeout(() => window.print(), 100); };
function guardarHTML() {
  const estado = JSON.stringify({ ...est, guardado: hoyISO() }).replace(/</g, '\\u003c');
  const html = PRISTINO.replace(/(<script type="application\/json" id="estado-inicial">)[\s\S]*?(<\/script>)/, (m, a, b) => a + estado + b);
  bajar(`El-varon-segun-Dios-con-mis-marcas-${fechaArchivo()}.html`, html, 'text/html');
  const e = $('#estado-copia'); if (e) e.textContent = 'Listo: se descargó el estudio completo con tus marcas. Abrilo cuando quieras; trae todo adentro.';
}
$('#guardar-btn').onclick = guardarHTML;

/* copia de las marcas (JSON) para pasar a otra compu */
function bajarCopia() { bajar(`varon-segun-dios-marcas-${fechaArchivo()}.json`, JSON.stringify({ app: 'varon-segun-dios', version: 1, fecha: hoyISO(), ...est }, null, 1), 'application/json'); $('#estado-copia').textContent = 'Copia descargada.'; }
async function cargarCopia(archivo) {
  const msg = t => { $('#estado-copia').textContent = t; };
  let c; try { c = JSON.parse(await archivo.text()); } catch (e) { msg('Ese archivo no es una copia del estudio.'); return; }
  if (!c || c.app !== 'varon-segun-dios') { msg('Ese archivo no es una copia del estudio.'); return; }
  let n = 0;
  Object.entries(c.hechos || {}).forEach(([d, f]) => { if (!est.hechos[d]) { est.hechos[d] = f; n++; } });
  Object.entries(c.notasDia || {}).forEach(([d, t]) => { const a = est.notasDia[d] || ''; if (t && !a.includes(t)) { est.notasDia[d] = a ? a + '\n\n— De la copia —\n' + t : t; n++; } });
  ['marcas', 'notas', 'trazos'].forEach(k => Object.entries(c[k] || {}).forEach(([d, xs]) => { const ya = new Set((est[k][d] || []).map(x => x.id)); xs.forEach(x => { if (!ya.has(x.id)) { lista(est[k], d).push(x); n++; } }); }));
  guardar(); render(); msg(n ? `Copia cargada: se sumaron ${n} elementos.` : 'La copia no tenía nada nuevo.');
}
document.addEventListener('click', e => {
  if (e.target.closest('#guardar-html-2')) guardarHTML();
  if (e.target.closest('#bajar-copia')) bajarCopia();
  if (e.target.closest('#cargar-copia-btn')) $('#cargar-copia').click();
});
document.addEventListener('change', e => { if (e.target.id === 'cargar-copia' && e.target.files[0]) cargarCopia(e.target.files[0]); });

/* ---------- búsqueda ---------- */
function buscar(v) {
  if (!indice) armarIndice();
  const q = sinTildes(v.trim()); if (q.length < 3) { $('#res').innerHTML = ''; return; }
  const propios = []; Object.entries(est.notasDia).forEach(([d, t]) => t && propios.push({ d: +d, sec: 'Tu nota', t })); Object.entries(est.notas).forEach(([d, ns]) => ns.forEach(n => n.txt && propios.push({ d: +d, sec: 'Tu nota al margen', t: n.txt })));
  const res = propios.concat(indice).filter(r => sinTildes(r.t + ' ' + r.sec).includes(q)).slice(0, 100);
  $('#res').innerHTML = res.length ? res.map(r => { const i = sinTildes(r.t).indexOf(q); const ini = Math.max(0, i - 90); return `<div class="resultado"><a href="#dia-${r.d}"><b>Día ${r.d}</b> · ${esc(r.sec)}</a><div>${ini ? '…' : ''}${esc(r.t.slice(ini, ini + 260))}…</div></div>`; }).join('') : '<p>No hay resultados.</p>';
}

/* ---------- ruteo ---------- */
function pintarLado() { const d = diaVisible(); if (d && D.dias[d]) $('#lado').innerHTML = ladoDia(d); }
function repintarDia() {
  const d = diaVisible(); if (!d) return; const y = scrollY;
  $('#principal').innerHTML = vistaDia(d); asignarClaves(d); aplicarMarcas(d); pintarNotas(d); dibujarTrazos(); pintarLado(); conectarDia(d); scrollTo(0, y);
}
function conectarDia(d) {
  const hb = $('#hecho-btn'); if (hb) hb.onclick = () => { if (est.hechos[d]) delete est.hechos[d]; else est.hechos[d] = hoyISO().slice(0, 10); guardar(); repintarDia(); pintarNav(); pintarProgreso(); };
}
function render() {
  const h = (location.hash || '#inicio').slice(1);
  rutaActual = h; let main = '', lado = '', esDia = false;
  const m = h.match(/^dia-(\d+)$/);
  if (m && diaPlan(+m[1])) { esDia = true; main = vistaDia(+m[1]); }
  else if (h === 'marcas') main = vistaMarcas();
  else if (h === 'datos') main = vistaDatos();
  else if (h === 'modelos') main = vistaModelos();
  else if (h === 'palabras') main = vistaPalabras();
  else if (h === 'buscar') main = vistaBuscar();
  else if (h === 'fuentes') main = vistaFuentes();
  else if (h === 'como-usar') main = vistaTexto(h);
  else { rutaActual = 'inicio'; main = vistaInicio(); }
  $('#principal').innerHTML = main; ocultarPop();
  $('#herramientas').hidden = !(esDia && D.dias[+m[1]]);
  if (esDia) { const d = +m[1]; asignarClaves(d); aplicarMarcas(d); pintarNotas(d); conectarDia(d); lado = ladoDia(d); }
  else ponerModo('leer');
  $('#lado').innerHTML = lado; $('#lado').hidden = !lado;
  document.querySelector('.app').style.gridTemplateColumns = lado ? '' : (innerWidth > 820 ? '280px minmax(0, 1fr)' : '');
  pintarNav(); pintarProgreso();
  if (h === 'buscar') setTimeout(() => $('#q') && $('#q').focus(), 0);
  window.scrollTo(0, 0);
  if (esDia) { document.fonts && document.fonts.ready ? document.fonts.ready.then(dibujarTrazos) : dibujarTrazos(); setTimeout(dibujarTrazos, 300); }
}
addEventListener('hashchange', render);
addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  const m = (location.hash || '').match(/^#dia-(\d+)$/); if (!m) return;
  const d = +m[1];
  if (e.key === 'ArrowRight' && d < TOTAL) location.hash = 'dia-' + (d + 1);
  if (e.key === 'ArrowLeft' && d > 1) location.hash = 'dia-' + (d - 1);
  if (e.key === 'Escape') ponerModo('leer');
});
ponerModo('leer');
render();
})();
</script>
